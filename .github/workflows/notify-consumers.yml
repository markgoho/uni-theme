name: Notify consumers of new commits

on:
  push:
    branches: [master]
    paths: &watched-paths
      - "assets/**"
      - "layouts/**"
      - "hugo.toml"
      - "go.mod"
      - "exampleSite/**"
      - ".github/workflows/notify-consumers.yml"
  pull_request:
    paths: *watched-paths

# Requires the CONSUMER_DISPATCH_TOKEN secret: a fine-grained PAT with
# Contents: Read and write on each consumer repo, since GITHUB_TOKEN
# can't reach across repos. See mbu#134. The PAT's repo scope must
# include markgoho/scouting-u before this matrix entry will work there.

jobs:
  # Builds exampleSite/, a minimal Hugo site that imports this repo as a
  # local Hugo Module and renders one req-card.html fixture per
  # text_format value (see uni-theme#24 and CONTRACT.md's "Text
  # utilities" section). dispatch below depends on this job and runs
  # only on push, so a text_format threading regression fails the build
  # BEFORE a bump PR is dispatched to any consumer -- this is the
  # pre-dispatch gate the issue asked for, not a canary that fires after
  # the fact.
  build-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build exampleSite
        working-directory: exampleSite
        run: hugo --gc

      - name: Assert text_format routed correctly
        working-directory: exampleSite
        run: |
          if grep -r "raw HTML omitted" public/; then
            echo "::error::text_format=\"html\" content was routed through markdownify instead of safeHTML -- see CONTRACT.md's Text utilities section"
            exit 1
          fi
          # Positive checks so an empty/missing fixture render (e.g. a
          # broken template lookup) can't pass the negative grep above
          # vacuously, and so a "html" node routed through safeHTML
          # (never checked by the omitted-comment grep) is caught too.
          grep -q '<sup id="fnref-1">' public/index.html
          grep -q '<sup id="fnref-2">' public/index.html
          grep -q 'class="footnote-ref"' public/index.html

  dispatch:
    needs: build-fixture
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        consumer: [markgoho/mbu, markgoho/scouting-u]
    steps:
      - name: Dispatch bump event to ${{ matrix.consumer }}
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_DISPATCH_TOKEN }}
        run: |
          gh api "repos/${{ matrix.consumer }}/dispatches" \
            -f event_type=uni-theme-bump \
            -F "client_payload[sha]=${{ github.sha }}"
