<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Option D · Patrol Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400..800;1,6..12,400..800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto.css">
<script src="data.js"></script>
<style>
/* DESIGN PLAN — Option D “Patrol Poster”
   Flat printed-poster graphics. No gradients, no shadows. 3px ink rules and borders.
   Tokens: --ground (canvas tan page), --panel (light paper panel), --ink (black-green), --green (Scouting green),
           --red (brick), --gold (marigold), --tan (canvas), plus a 7-step campfire ramp --c1..--c7 (pine → brick)
           used for SU rank levels, MBU categories and requirement header bands.
   Type: --display Bricolage Grotesque 800, uppercase, tight tracking · --body Nunito Sans. Verbatim text is body sans on a light panel;
         curated titles are display caps on colour bands. Icons: Material Symbols Rounded.
   Home MBU: poster headline + framed hero, category tile wall, Eagle rail (scroll-snap). Home SU: seven rank stripes in two phase regions.
   Award: name poster + emblem / giant level numeral, sticker facts, numbered “what you’ll do”, chunky resource buttons.
   Requirements: colour-blocked panels, giant number, rotated mode stamps, lettered rows / choice tiles, “more” resource row.
   Guide: chapter strip, title block with quoted requirement, wide prose, full-bleed stamped callout bands, giant prev/next arrows.
   Search: giant query echo, count stamp, colour-blocked award tiles with stacked hit rows. */
:root{
  --ground:oklch(0.93 0.035 85); --panel:oklch(0.985 0.01 88); --panel-2:oklch(0.955 0.02 86);
  --ink:oklch(0.21 0.03 155); --ink-2:oklch(0.38 0.03 150); --ink-3:oklch(0.50 0.025 145);
  --green:oklch(0.40 0.095 152); --on-green:oklch(0.98 0.01 90);
  --red:oklch(0.50 0.175 30); --on-red:oklch(0.98 0.01 90);
  --gold:oklch(0.83 0.16 85); --on-gold:oklch(0.21 0.03 155);
  --tan:oklch(0.85 0.06 78); --on-tan:oklch(0.21 0.03 155);
  --c1:oklch(0.33 0.07 160); --on-c1:oklch(0.98 0.01 90);
  --c2:oklch(0.42 0.10 150); --on-c2:oklch(0.98 0.01 90);
  --c3:oklch(0.47 0.09 195); --on-c3:oklch(0.98 0.01 90);
  --c4:oklch(0.84 0.06 78);  --on-c4:oklch(0.21 0.03 155);
  --c5:oklch(0.83 0.16 85);  --on-c5:oklch(0.21 0.03 155);
  --c6:oklch(0.66 0.17 50);  --on-c6:oklch(0.17 0.03 40);
  --c7:oklch(0.50 0.175 30); --on-c7:oklch(0.98 0.01 90);
  --mark:oklch(0.88 0.17 92); --link:oklch(0.43 0.11 150);
  --display:"Bricolage Grotesque","Arial Black",Impact,sans-serif; --body:"Nunito Sans","Avenir Next",system-ui,sans-serif;
  --rule:3px; --gutter:clamp(16px,4vw,40px); --measure:68ch;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:oklch(0.20 0.025 165); --panel:oklch(0.26 0.025 160); --panel-2:oklch(0.30 0.025 160);
  --ink:oklch(0.95 0.015 90); --ink-2:oklch(0.80 0.02 90); --ink-3:oklch(0.68 0.02 90);
  --green:oklch(0.50 0.10 152); --on-green:oklch(0.98 0.01 90);
  --red:oklch(0.60 0.17 30); --on-red:oklch(0.98 0.01 90);
  --gold:oklch(0.82 0.15 85); --on-gold:oklch(0.18 0.03 155);
  --tan:oklch(0.76 0.06 78); --on-tan:oklch(0.18 0.03 155);
  --c1:oklch(0.42 0.08 160); --c2:oklch(0.50 0.10 150); --c3:oklch(0.55 0.09 195);
  --c4:oklch(0.76 0.06 78); --c5:oklch(0.82 0.15 85); --c6:oklch(0.70 0.16 50); --c7:oklch(0.60 0.17 30);
  --on-c4:oklch(0.18 0.03 155); --on-c5:oklch(0.18 0.03 155); --on-c6:oklch(0.17 0.03 40);
  --mark:oklch(0.55 0.13 85); --link:oklch(0.85 0.12 90);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:oklch(0.20 0.025 165); --panel:oklch(0.26 0.025 160); --panel-2:oklch(0.30 0.025 160);
  --ink:oklch(0.95 0.015 90); --ink-2:oklch(0.80 0.02 90); --ink-3:oklch(0.68 0.02 90);
  --green:oklch(0.50 0.10 152); --on-green:oklch(0.98 0.01 90);
  --red:oklch(0.60 0.17 30); --on-red:oklch(0.98 0.01 90);
  --gold:oklch(0.82 0.15 85); --on-gold:oklch(0.18 0.03 155);
  --tan:oklch(0.76 0.06 78); --on-tan:oklch(0.18 0.03 155);
  --c1:oklch(0.42 0.08 160); --c2:oklch(0.50 0.10 150); --c3:oklch(0.55 0.09 195);
  --c4:oklch(0.76 0.06 78); --c5:oklch(0.82 0.15 85); --c6:oklch(0.70 0.16 50); --c7:oklch(0.60 0.17 30);
  --on-c4:oklch(0.18 0.03 155); --on-c5:oklch(0.18 0.03 155); --on-c6:oklch(0.17 0.03 40);
  --mark:oklch(0.55 0.13 85); --link:oklch(0.85 0.12 90);
  color-scheme:dark}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 1.0625rem/1.55 var(--body);font-optical-sizing:auto;padding-block-end:5.5rem;overflow-x:clip}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration-thickness:2px;text-underline-offset:.18em}
a:hover{color:var(--red)}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;font-optical-sizing:auto;line-height:.95;margin:0;text-transform:uppercase;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0}
.ms{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;font-size:1.3em;line-height:1;display:inline-block;vertical-align:-.22em;flex:none}
.ms--fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.wrap{max-width:84rem;margin-inline:auto;padding-inline:var(--gutter)}
.disp{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:.95}
.kick{font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
mark{background:var(--mark);color:var(--ink);padding-inline:.12em;font-weight:700}
.visually-hidden{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){ a,button{transition:background-color .15s,color .15s,translate .15s} }

/* ---------- stickers & stamps ---------- */
.stamp{display:inline-block;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;line-height:1;padding:.5em .7em;border:var(--rule) solid currentColor;color:var(--red);background:var(--panel);rotate:-5deg;white-space:nowrap}
.stamp--gold{color:var(--on-gold);background:var(--gold);border-color:var(--on-gold)}
.stamp--green{color:var(--on-green);background:var(--green);border-color:var(--green)}
.stamp--red{color:var(--on-red);background:var(--red);border-color:var(--red)}
.stamp--ink{color:var(--ground);background:var(--ink);border-color:var(--ink)}
.stamp--big{font-size:clamp(1rem,2.2vw,1.4rem);padding:.55em .8em}
.pill{display:inline-flex;align-items:center;gap:.4em;font-family:var(--display);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;line-height:1;padding:.6em .95em;border-radius:999px;border:var(--rule) solid var(--ink);background:var(--panel);color:var(--ink);text-decoration:none;white-space:nowrap}
.pill--gold{background:var(--gold);color:var(--on-gold)}
.pill--red{background:var(--red);color:var(--on-red);border-color:var(--red)}
.pill--green{background:var(--green);color:var(--on-green);border-color:var(--green)}
.pill--ink{background:var(--ink);color:var(--ground)}
a.pill:hover{translate:0 -2px;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:.75rem;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;font-size:clamp(1rem,1.6vw,1.25rem);padding:1rem 1.25rem;border:var(--rule) solid var(--ink);background:var(--panel);color:var(--ink);text-decoration:none;line-height:1}
.btn small{display:block;font-family:var(--body);font-weight:600;font-size:.8rem;text-transform:none;letter-spacing:0;color:var(--ink-2);margin-block-start:.35em}
.btn--green{background:var(--green);color:var(--on-green);border-color:var(--green)} .btn--green small{color:inherit;opacity:.85}
.btn--red{background:var(--red);color:var(--on-red);border-color:var(--red)} .btn--red small{color:inherit;opacity:.85}
.btn--gold{background:var(--gold);color:var(--on-gold);border-color:var(--ink)} .btn--gold small{color:inherit;opacity:.8}
.btn:hover{translate:0 -2px;color:inherit}

/* ---------- header / nav ---------- */
.hdr{background:var(--green);color:var(--on-green);border-block-end:var(--rule) solid var(--ink)}
.hdr__in{display:flex;align-items:center;gap:1rem;min-height:4.25rem;padding-block:.6rem}
.brand{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(1.25rem,2.4vw,1.7rem);line-height:.9;text-decoration:none;color:inherit;display:flex;align-items:center;gap:.5rem}
.brand .ms{font-size:1.5em}
.brand:hover{color:var(--gold)}
.hdr__nav{display:flex;align-items:center;gap:.25rem;margin-inline-start:auto}
.hdr__nav>*{flex:none}
.brand{flex:1 1 auto}
@media (max-width:860px){ .hdr__nav{flex:none} }
@media (max-width:480px){ .brand{font-size:1.1rem} .brand .ms{font-size:1.4em} }
.hdr__nav a.navlink{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:.9rem;text-decoration:none;padding:.5rem .7rem;color:inherit}
.hdr__nav a.navlink:hover{color:var(--gold)}
.hdr__nav a.navlink[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--gold)}
.hdr__search{display:flex;align-items:center;border:var(--rule) solid var(--ink);background:var(--panel);color:var(--ink);border-radius:999px;padding-inline:.5rem .25rem;height:2.5rem}
.hdr__search input{border:0;background:transparent;font:600 .95rem var(--body);color:inherit;width:11rem;padding-inline:.4rem;outline:none}
.hdr__search input::placeholder{color:var(--ink-3)}
.hdr__search button{border:0;background:var(--ink);color:var(--ground);border-radius:999px;width:1.9rem;height:1.9rem;display:grid;place-items:center;cursor:pointer}
.iconbtn{appearance:none;border:var(--rule) solid var(--on-green);background:transparent;color:inherit;width:2.5rem;height:2.5rem;border-radius:999px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.hdr__menu{display:none}
@media (max-width:860px){
  .hdr__nav .navlink,.hdr__nav .cta,.hdr__search{display:none}
  .hdr__menu{display:block;position:relative;margin-inline-start:auto}
  .hdr__menu summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:.85rem;padding:.55rem .9rem;border:var(--rule) solid var(--on-green);border-radius:999px}
  .hdr__menu summary::-webkit-details-marker{display:none}
  .hdr__menu[open] summary{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
  .hdr__menu .menu{position:absolute;inset-inline-end:0;inset-block-start:calc(100% + .6rem);z-index:50;background:var(--panel);color:var(--ink);border:var(--rule) solid var(--ink);min-width:16rem;display:grid;gap:.25rem;padding:.75rem}
  .hdr__menu .menu a{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:1rem;text-decoration:none;padding:.6rem .5rem;border-block-end:2px solid var(--panel-2)}
  .hdr__menu .menu form{display:flex;border:var(--rule) solid var(--ink);border-radius:999px;margin-block:.5rem .25rem;padding-inline:.6rem .25rem;height:2.6rem;align-items:center}
  .hdr__menu .menu form input{border:0;background:transparent;font:600 1rem var(--body);color:inherit;flex:1;outline:none}
  .hdr__menu .menu form button{border:0;background:var(--ink);color:var(--ground);border-radius:999px;width:2rem;height:2rem;display:grid;place-items:center}
  .hdr__nav{gap:.5rem}
}

/* ---------- section tab strip ---------- */
.tabs{background:var(--ink);border-block-end:var(--rule) solid var(--ink)}
.tabs ul{display:flex;list-style:none;overflow-x:auto;scrollbar-width:none;padding-inline:var(--gutter)}
.tabs ul::-webkit-scrollbar{display:none}
.tabs li{flex:1 0 auto;display:flex}
.tabs a{flex:1;display:flex;align-items:center;justify-content:center;gap:.6rem;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(1rem,1.8vw,1.35rem);text-decoration:none;color:var(--ground);padding:.95rem 1.5rem;border-inline-end:var(--rule) solid var(--ground);white-space:nowrap}
.tabs li:first-child a{border-inline-start:var(--rule) solid var(--ground)}
.tabs a:hover{background:var(--green);color:var(--on-green)}
.tabs a[aria-current="page"]{background:var(--gold);color:var(--on-gold)}
.tabs a small{font-family:var(--body);font-weight:700;font-size:.75rem;text-transform:none;letter-spacing:0;opacity:.85}
@media (max-width:640px){ .tabs ul{padding-inline:0} .tabs li{flex:0 0 auto} .tabs a{padding-inline:1.1rem} }

/* ---------- breadcrumb ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:.35rem .5rem;list-style:none;font-family:var(--display);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-block:1rem}
.crumbs li{display:flex;align-items:center;gap:.5rem}
.crumbs li+li::before{content:"";width:.5rem;height:.5rem;background:var(--red);rotate:45deg;flex:none}
.crumbs a{text-decoration:none}
.crumbs [aria-current]{color:var(--ink)}

/* ---------- footer ---------- */
.ftr{background:var(--ink);color:var(--ground);border-block-start:var(--rule) solid var(--ink);margin-block-start:4rem}
.ftr__band{background:var(--red);color:var(--on-red);padding-block:1.25rem;border-block-end:var(--rule) solid var(--ink)}
.ftr__band .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem}
.ftr__band .disp{font-size:clamp(1.4rem,3vw,2.2rem)}
.ftr__in{display:grid;grid-template-columns:minmax(14rem,1.3fr) repeat(auto-fit,minmax(10rem,1fr));gap:2rem;padding-block:2.5rem}
.ftr h2{font-size:1rem;letter-spacing:.1em;color:var(--gold);margin-block-end:.75rem}
.ftr ul{list-style:none;display:grid;gap:.4rem}
.ftr a{text-decoration:none;font-weight:700}
.ftr a:hover{color:var(--gold)}
.ftr__tag{font-size:1.05rem;max-width:30ch;color:var(--tan)}
.ftr__legal{border-block-start:2px solid var(--ink-3);padding-block:1rem;font-size:.85rem;color:var(--tan);display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between}
@media (max-width:640px){ .ftr__in{grid-template-columns:1fr 1fr} .ftr__in>div:first-child{grid-column:1/-1} }

/* ---------- home (MBU poster) ---------- */
.poster{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:center;padding-block:clamp(2rem,5vw,4rem)}
.poster h1{font-size:clamp(2.8rem,7.5vw,6.5rem);line-height:.88}
.poster h1 em{font-style:normal;color:var(--red)}
.poster__lede{font-size:clamp(1.05rem,1.5vw,1.3rem);max-width:44ch;margin-block:1.25rem;font-weight:600;color:var(--ink-2);text-wrap:pretty}
.poster__actions{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.bigsearch{display:flex;align-items:center;border:var(--rule) solid var(--ink);background:var(--panel);border-radius:999px;height:3.4rem;padding-inline:1rem .4rem;max-width:36rem;margin-block-end:1rem}
.bigsearch input{flex:1;border:0;background:transparent;font:600 1.1rem var(--body);color:var(--ink);outline:none}
.bigsearch input::placeholder{color:var(--ink-3)}
.bigsearch button{border:0;background:var(--red);color:var(--on-red);border-radius:999px;height:2.6rem;padding-inline:1.1rem;font:800 .9rem var(--display);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.frame{position:relative;padding:var(--rule);background:var(--ink);clip-path:polygon(0 0,100% 0,100% 82%,84% 100%,0 100%)}
.frame img{aspect-ratio:5/4;object-fit:cover;width:100%;clip-path:polygon(0 0,100% 0,100% 81.5%,83.6% 100%,0 100%)}
.frame .stamp{position:absolute;inset-inline-start:.75rem;inset-block-start:1rem;rotate:-8deg}
.frame .frame__count{position:absolute;inset-inline-end:1rem;inset-block-end:1rem;background:var(--gold);color:var(--on-gold);border:var(--rule) solid var(--ink);padding:.6rem .9rem;font-family:var(--display);font-weight:800;line-height:.9;text-transform:uppercase;text-align:center}
.frame .frame__count b{display:block;font-size:2.4rem}
.frame .frame__count small{font-size:.7rem;letter-spacing:.1em}
@media (max-width:760px){ .poster{grid-template-columns:1fr} .frame{order:-1;max-width:28rem} .frame img{aspect-ratio:16/10} }

.sec{padding-block:clamp(2rem,4vw,3.5rem);border-block-start:var(--rule) solid var(--ink)}
.sec__head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;margin-block-end:1.5rem}
.sec__head h2{font-size:clamp(1.9rem,4vw,3.2rem)}
.sec__head p{font-weight:600;color:var(--ink-2);max-width:48ch}
.sec--green{background:var(--green);color:var(--on-green)} .sec--green .sec__head p{color:inherit;opacity:.9}
.sec--tan{background:var(--tan);color:var(--on-tan)}
.sec--panel{background:var(--panel)}

.tilewall{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:var(--rule);padding:var(--rule)}
.tile{box-shadow:0 0 0 var(--rule) var(--ink)}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:1.5rem;min-height:9.5rem;padding:1rem;background:var(--c);color:var(--on);text-decoration:none}
.tile .ms{font-size:2rem}
.tile b{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.95;font-size:clamp(.85rem,2.6vw,1.05rem);display:block;text-wrap:balance;hyphens:auto}
.tile small{display:block;font-weight:700;font-size:.8rem;margin-block-start:.3rem;opacity:.85}
.tile:hover{color:var(--on);outline:var(--rule) solid var(--gold);outline-offset:calc(-1 * var(--rule))}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(13.5rem,16rem);gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:.5rem 1rem;scroll-padding-inline:var(--gutter);margin-inline:calc(-1 * var(--gutter));padding-inline:var(--gutter);scrollbar-color:var(--gold) transparent}
.patch{scroll-snap-align:start;background:var(--panel);color:var(--ink);border:var(--rule) solid var(--ink);text-decoration:none;display:grid;grid-template-rows:auto 1fr;position:relative}
.patch img{aspect-ratio:1;object-fit:cover;width:100%;border-block-end:var(--rule) solid var(--ink)}
.patch__body{padding:.85rem 1rem 1rem}
.patch b{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.95;font-size:1.25rem;display:block}
.patch small{display:block;font-weight:700;color:var(--ink-2);margin-block-start:.4rem;font-size:.8rem}
.patch .stamp{position:absolute;inset-inline-start:-.5rem;inset-block-start:.6rem;font-size:.7rem}
.patch:hover{color:var(--ink);outline:var(--rule) solid var(--gold);outline-offset:0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:var(--rule);background:var(--ink);border:var(--rule) solid var(--ink)}
.step{background:var(--panel);color:var(--ink);padding:1.25rem;display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:start}
.step .num{font-family:var(--display);font-weight:800;font-size:4rem;line-height:.8;color:var(--red)}
.step h3{font-size:1.3rem;margin-block-end:.4rem;text-transform:uppercase}
.step p{color:var(--ink-2);font-weight:500}

/* ---------- home (SU trail) ---------- */
.trail-head{padding-block:clamp(2rem,5vw,4rem);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:2rem;align-items:center}
.trail-head h1{font-size:clamp(2.8rem,8vw,7rem);line-height:.86}

/* ---------- award poster ---------- */

.todo li::before{content:counter(todo);font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;display:grid;place-items:center;align-self:stretch;background:var(--c);color:var(--on);border-inline-end:var(--rule) solid var(--ink)}

@media (max-width:560px){ .neighbors{grid-template-columns:1fr} }

/* ---------- requirements: colour-blocked panels ---------- */
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem 2rem;padding-block:1rem 2rem}
.pagehead h1{font-size:clamp(2.6rem,6vw,5rem)}
.pagehead h1 small{display:block;font-size:.32em;letter-spacing:.06em;color:var(--red);margin-block-end:.3em}
.pagehead p{font-weight:600;color:var(--ink-2);max-width:60ch;margin-block-start:.75rem;text-wrap:pretty}
.pagehead__side{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;font-weight:700;font-size:.85rem;color:var(--ink-2);margin-block-end:1.5rem}
.legend span{display:inline-flex;align-items:center;gap:.5rem}

.legend i.is-panel{background:var(--panel)} .legend i.is-band{background:var(--green)}
.reqs{display:grid;gap:2rem}
.req{position:relative;border:var(--rule) solid var(--ink);background:var(--panel);color:var(--ink);scroll-margin-block-start:5rem}
.req__band{display:grid;grid-template-columns:auto 1fr;align-items:stretch;background:var(--c);color:var(--on);border-block-end:var(--rule) solid var(--ink)}
.req__num{font-family:var(--display);font-weight:800;font-size:clamp(3.5rem,8vw,6rem);line-height:.8;padding:1rem 1.25rem;display:grid;place-items:center;border-inline-end:var(--rule) solid var(--ink);min-width:6rem;letter-spacing:-.04em}
.req__title{padding:1.1rem 1.25rem;display:grid;gap:.5rem;align-content:center;padding-inline-end:9.5rem}
.req__title h2{font-size:clamp(1.5rem,3.2vw,2.5rem)}
.req__title .kick{color:inherit;opacity:.85}
.req .stamp.req__mode{position:absolute;inset-inline-end:1rem;inset-block-start:-.9rem;rotate:4deg;z-index:2}
.req__body{padding:1.25rem}
.vb{font-family:var(--body);font-size:1.0625rem;line-height:1.55;color:var(--ink);max-width:var(--measure);text-wrap:pretty}
.vb--stem{font-weight:700;font-size:1.1rem}
.vb--lead{font-size:1.15rem;font-weight:500}
.vb p{margin:0} .vb p+p{margin-block-start:.6em}

.vb strong{font-weight:800}
.vlist{list-style:none;display:grid;gap:.35rem;margin-block-start:.75rem;max-width:var(--measure)}
.vlist li{display:grid;grid-template-columns:1rem 1fr;gap:.6rem;align-items:baseline}
.vlist li::before{content:"";width:.7rem;height:.7rem;background:var(--c,var(--red));border:2px solid var(--ink);translate:0 .1em}
.rows{display:grid;gap:var(--rule);background:var(--ink);border:var(--rule) solid var(--ink);margin-block-start:1rem}
.row{display:grid;grid-template-columns:3.25rem minmax(0,1fr);background:var(--panel);scroll-margin-block-start:5rem}
.row--deep{grid-template-columns:3.25rem minmax(0,1fr);background:var(--panel-2)}
.row__m{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1;display:grid;place-items:start center;padding-block:1rem;background:var(--panel-2);color:var(--ink);border-inline-end:var(--rule) solid var(--ink);text-transform:lowercase}
.row--deep .row__m{background:var(--panel);font-size:1.1rem}
.row__c{padding:.9rem 1rem 1rem;display:grid;gap:.5rem;position:relative}
.row__head{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .75rem}
.row__head h3{font-size:1.1rem;color:var(--ink);letter-spacing:0}
.pathtag{font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.06em;padding:.25em .5em;border:2px solid var(--ink);color:var(--ink);line-height:1;text-transform:uppercase}
.guidelink{display:inline-flex;align-items:center;gap:.25rem;font-family:var(--display);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;background:var(--gold);color:var(--on-gold);padding:.35em .6em;border:2px solid var(--ink);margin-inline-start:auto;line-height:1}

.more{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .5rem;margin-block-start:.35rem}

.more a{font-size:.8rem;font-weight:700;text-decoration:none;border:2px solid var(--ink-3);color:var(--ink);padding:.3em .6em;border-radius:999px;display:inline-flex;align-items:center;gap:.3em;max-width:100%}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:var(--rule);background:var(--ink);border:var(--rule) solid var(--ink);margin-block-start:1rem}
.choice{background:var(--panel);display:grid;grid-template-rows:auto 1fr auto;gap:.6rem;padding:1rem;position:relative;min-height:9rem}

/* ---------- guide: zine spread ---------- */
.chapters{background:var(--panel);border-block-end:var(--rule) solid var(--ink)}
.chapters__in{display:flex;align-items:stretch;gap:0;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.chapters__in .kick{flex:none;align-self:center;padding-inline-end:1rem;white-space:nowrap;border-inline-end:var(--rule) solid var(--ink);margin-inline-end:.5rem;padding-block:.5rem}
.chap{flex:none;display:flex;flex-direction:column;justify-content:center;gap:.15rem;padding:.75rem .9rem;text-decoration:none;border-inline-end:2px solid var(--panel-2);min-width:7rem;max-width:11rem}
.chap b{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:.95rem;line-height:1;letter-spacing:-.01em}
.chap small{font-size:.72rem;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap:hover{background:var(--panel-2);color:inherit}
.chap[aria-current="true"]{background:var(--gold);color:var(--on-gold)} .chap[aria-current="true"] small{color:inherit}
.chap--items{display:flex;flex-direction:row;flex:none;gap:0}
.gtitle{background:var(--c,var(--green));color:var(--on,var(--on-green));border-block-end:var(--rule) solid var(--ink);padding-block:clamp(1.5rem,4vw,3rem)}
.gtitle__in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(1.5rem,4vw,3rem);align-items:center}
.gtitle h1{font-size:clamp(2.6rem,6.5vw,5.5rem);line-height:.86}
.gtitle .kick{color:inherit;opacity:.9;margin-block-end:.75rem;font-size:.9rem}
.gtitle .kick b{background:var(--ink);color:var(--ground);padding:.2em .5em;margin-inline-end:.5em}
.quote{position:relative;background:var(--panel);color:var(--ink);border:var(--rule) solid var(--ink);padding:1.5rem 1.5rem 1.25rem}
.quote .stamp{position:absolute;inset-block-start:-1rem;inset-inline-start:1rem;rotate:-3deg}
.quote .vb{font-size:1.15rem;font-weight:600;margin-block-start:.5rem}
.quote .pathtag{font-size:1.1rem;padding:.3em .55em;margin-block-end:.35rem;display:inline-block}
.quote__foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem;margin-block-start:1rem;font-size:.8rem;font-weight:700;color:var(--ink-2)}
.quote__foot a{text-decoration:none;color:var(--link)}
@media (max-width:760px){ .gtitle__in{grid-template-columns:1fr} }
.zine{display:grid;grid-template-columns:[full-start] minmax(var(--gutter),1fr) [main-start] minmax(0,var(--measure)) [main-end] minmax(var(--gutter),1fr) [full-end];row-gap:1.25rem;padding-block:2.5rem 1rem;font-size:1.125rem;line-height:1.6}
.zine>*{grid-column:main}
.zine>.bleed{grid-column:full;margin-block:1rem}
.zine h2{font-size:clamp(1.8rem,3.5vw,2.6rem);margin-block-start:1.5rem;padding-block-start:1rem;border-block-start:var(--rule) solid var(--ink)}
.zine h3{font-size:1.35rem;margin-block-start:.75rem;letter-spacing:0}
.zine p{text-wrap:pretty}
.zine a{color:var(--link);font-weight:700}
.zine ul,.zine ol{display:grid;gap:.5rem;padding-inline-start:0;list-style:none}
.zine ul li{display:grid;grid-template-columns:1.1rem 1fr;gap:.75rem;align-items:baseline}
.zine ul li::before{content:"";width:.75rem;height:.75rem;background:var(--red);border:2px solid var(--ink);translate:0 .1em}
.zine ol{counter-reset:z}
.zine ol li{counter-increment:z;display:grid;grid-template-columns:2.6rem 1fr;gap:.75rem;align-items:start}
.zine ol li::before{content:counter(z);font-family:var(--display);font-weight:800;font-size:2rem;line-height:.9;color:var(--red)}
.band{display:grid;grid-template-columns:[full-start] minmax(var(--gutter),1fr) [main-start] minmax(0,calc(var(--measure) + 6rem)) [main-end] minmax(var(--gutter),1fr) [full-end];padding-block:1.75rem 1.5rem;border-block:var(--rule) solid var(--ink);position:relative;background:var(--c);color:var(--on)}
.band>*{grid-column:main}
.band .stamp{position:absolute;inset-block-start:-1rem;inset-inline-start:var(--gutter);rotate:-3deg}
.band h3{font-size:1.5rem;margin:0 0 .5rem;color:inherit;letter-spacing:0}
.band p,.band li{color:inherit}
.band ul li::before{background:var(--panel)}
.band ol li::before{color:inherit}
.band .vb{color:inherit;max-width:none}
.band a{color:inherit}
.band small{display:block;font-weight:700;opacity:.85;margin-block-end:.5rem}
.band--tip{--c:var(--gold);--on:var(--on-gold)}
.band--safety{--c:var(--red);--on:var(--on-red)}
.band--prep{--c:var(--green);--on:var(--on-green)}
.band--check{--c:var(--tan);--on:var(--on-tan)}
.band--check ul li::before{background:transparent;width:.9rem;height:.9rem;border-width:3px}
.zfig{margin:0}
.zfig img{border:var(--rule) solid var(--ink);width:100%}
.zfig figcaption{font-size:.9rem;font-weight:700;color:var(--ink-2);margin-block-start:.5rem}
.poster-card{display:grid;grid-template-columns:minmax(7rem,9rem) 1fr;border:var(--rule) solid var(--ink);background:var(--panel);text-decoration:none;color:var(--ink)}
.poster-card__ic{background:var(--red);color:var(--on-red);display:grid;place-items:center;border-inline-end:var(--rule) solid var(--ink)}
.poster-card__ic .ms{font-size:3.5rem}
.poster-card--link .poster-card__ic{background:var(--green);color:var(--on-green)}
.poster-card__b{padding:1rem 1.25rem;display:grid;gap:.3rem;align-content:center}
.poster-card__b b{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1.2rem;line-height:1;letter-spacing:-.01em}
.poster-card__b span{font-size:.95rem;color:var(--ink-2);font-weight:600}
.poster-card__b small{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--red)}
.poster-card:hover{color:var(--ink);outline:var(--rule) solid var(--gold)}
.nextpage{background:var(--ink);color:var(--ground);padding:1.5rem;display:grid;gap:.5rem;text-decoration:none;position:relative}
.nextpage .kick{color:var(--gold)}
.nextpage b{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(1.5rem,3vw,2.2rem);line-height:.95}

.nextpage:hover{color:var(--ground)} .nextpage:hover b{color:var(--gold)}
.arrows{display:grid;grid-template-columns:1fr 1fr;gap:var(--rule);background:var(--ink);border:var(--rule) solid var(--ink);margin-block-start:2.5rem}
.arrow{background:var(--panel);display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;padding:1.25rem;text-decoration:none;color:var(--ink);min-height:7rem}
.arrow--next{grid-template-columns:1fr auto;text-align:end}
.arrow .ms{font-size:3.5rem;color:var(--red)}
.arrow .kick{display:block;margin-block-end:.3rem}
.arrow b{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(1.1rem,2.2vw,1.6rem);line-height:.95;display:block}
.arrow:hover{background:var(--gold);color:var(--on-gold)} .arrow:hover .ms{color:var(--on-gold)}
@media (max-width:560px){ .arrows{grid-template-columns:1fr} .arrow .ms{font-size:2.5rem} .poster-card{grid-template-columns:5rem 1fr} .poster-card__ic .ms{font-size:2.4rem} }

/* ---------- search: tiles ---------- */
.shead{padding-block:clamp(1.5rem,4vw,3rem);display:grid;gap:1rem}
.shead .kick{font-size:.9rem}
.shead h1{font-size:clamp(3rem,10vw,8rem);line-height:.84;color:var(--red);word-break:break-word}

.shead__row{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.5rem}
.shead__row p{font-weight:600;color:var(--ink-2)}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22rem),1fr));gap:1.25rem}
.stile{border:var(--rule) solid var(--ink);background:var(--panel);display:grid;grid-template-rows:auto 1fr}
.stile__head{display:grid;grid-template-columns:5rem 1fr;align-items:stretch;background:var(--c);color:var(--on);border-block-end:var(--rule) solid var(--ink);text-decoration:none}

.stile__head .lvl{display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:3rem;line-height:.8;border-inline-end:var(--rule) solid var(--ink)}
.stile__head .lvl small{font-size:.6rem;letter-spacing:.14em;margin-block-start:.3rem}
.stile__t{padding:.75rem 1rem;display:grid;align-content:center;gap:.25rem}
.stile__t h2{font-size:1.4rem;line-height:.95}
.stile__t small{font-weight:700;font-size:.78rem;opacity:.9}
.stile__head:hover{color:var(--on);outline:var(--rule) solid var(--gold);outline-offset:calc(-1 * var(--rule))}
.hits{list-style:none;display:grid;align-content:start}
.hit{display:grid;grid-template-columns:auto 1fr;gap:.75rem;padding:.9rem 1rem;border-block-start:2px solid var(--panel-2)}
.hit:first-child{border-block-start:0}
.hit a{text-decoration:none;display:grid;gap:.2rem;align-content:start}
.hit b{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:1rem;line-height:1;letter-spacing:-.01em}
.hit p{font-size:.95rem;color:var(--ink-2);font-weight:500}
.hit a:hover b{color:var(--red)}
.hit .pathtag{align-self:start;background:var(--c);color:var(--on);border-color:var(--ink);margin-block-start:.1rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms = (name, cls='') => `<span class="ms ${cls}" aria-hidden="true">${name}</span>`;
const isMBU = site => site.key === 'mbu';
const tone = i => { const n = ((i % 7) + 7) % 7 + 1; return `--c:var(--c${n});--on:var(--on-c${n})`; };
const catIndex = (site, name) => Math.max(0, (site.categories || []).findIndex(c => c.name === name));
const awardTone = site => isMBU(site) ? tone(catIndex(site, site.award.category)) : tone(site.award.level - 1);
const ICON = { tractor:'agriculture', 'paint-brush-household':'brush', factory:'factory', broadcast:'cell_tower', recycle:'recycling', 'puzzle-piece':'extension', binoculars:'forest', compass:'explore', atom:'science', briefcase:'work', 'hand-heart':'volunteer_activism', 'soccer-ball':'sports_soccer', wrench:'build', 'car-simple':'directions_car', 'list-checks':'checklist', book:'menu_book', trophy:'emoji_events' };
const icon = n => ICON[n] || 'star';
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const resIcon = t => /\(video\)/i.test(t) ? 'play_circle' : /\(pdf\)/i.test(t) ? 'picture_as_pdf' : 'link';
const modeLabel = m => !m ? '' : m.type === 'all' ? 'Do all' : `Pick ${['one','two','three','four','five','six'][m.count - 1] || m.count}`;
const vtext = node => node.textFormat === 'html' ? node.text : esc(node.text);
const siteIcon = site => isMBU(site) ? 'military_tech' : 'hiking';

/* ---------- chrome ---------- */
function searchForm(site, cls, value='') {
  return `<form class="${cls}" role="search" action="/search/"><label class="visually-hidden" for="${cls}-q">Search requirements</label><input id="${cls}-q" type="search" name="q" placeholder="Search ${esc(site.awardPlural)}…" value="${esc(value)}" autocomplete="off"><button type="submit" aria-label="Search">${ms('search')}</button></form>`;
}
function header(site, ctx) {
  const navLinks = [...site.nav.map(n => ({ name: n.name, url: n.url })), { name: 'Search', url: '/search/' }];
  const cur = u => (u === '/search/' && ctx.page === 'search') ? ' aria-current="page"' : '';
  return `<header class="hdr"><div class="wrap hdr__in">
    <a class="brand" href="/" aria-label="${esc(site.name)} home">${ms(siteIcon(site), 'ms--fill')}<span>${esc(site.name)}</span></a>
    <nav class="hdr__nav" aria-label="Primary">
      ${navLinks.map(n => `<a class="navlink" href="${n.url}"${cur(n.url)}>${esc(n.name)}</a>`).join('')}
      ${searchForm(site, 'hdr__search')}
      <a class="pill pill--gold cta" href="${site.cta.href}">${esc(site.cta.label)} ${ms('arrow_forward')}</a>
      <button class="iconbtn" type="button" data-toggle-theme aria-label="Switch to ${ctx.dark ? 'light' : 'dark'} theme" title="Theme">${ms(ctx.dark ? 'light_mode' : 'dark_mode')}</button>
      <details class="hdr__menu"><summary>${ms('menu')} Menu</summary><div class="menu">
        ${navLinks.map(n => `<a href="${n.url}">${esc(n.name)}</a>`).join('')}
        <a href="${site.cta.href}">${esc(site.cta.label)}</a>
        ${searchForm(site, 'menu-search')}
      </div></details>
    </nav></div></header>`;
}
function crumbUrl(site, label, i, arr) {
  if (i === 0) return '/';
  if (i === arr.length - 1) return null;
  if (label === site.award.title || label === `${site.award.title} ${site.awardLabel}`) return site.award.url;
  if (label === 'Requirements') return site.award.requirementsUrl;
  if (label === site.guideLabel) return site.award.guideUrl;
  if (label === 'Merit Badges' || label === 'Rank Advancement') return site.cta.href;
  const n = site.nav.find(x => x.name === label); return n ? n.url : site.cta.href;
}
function crumbs(site, page) {
  const list = site.breadcrumbs[page] || [];
  return `<nav aria-label="Breadcrumb"><ol class="crumbs">${list.map((l, i, a) => { const u = crumbUrl(site, l, i, a); return `<li>${u ? `<a href="${u}">${esc(l)}</a>` : `<span aria-current="page">${esc(l)}</span>`}</li>`; }).join('')}</ol></nav>`;
}
function tabs(site, page) {
  const a = site.award;
  const t = [
    ['award', 'Overview', a.url, `${esc(a.title)} ${esc(a.label)}`],
    ['requirements', 'Requirements', a.requirementsUrl, plural(a.reqCount, 'requirement')],
    ['guide', 'Guide', a.guideUrl, `${a.guidePages} pages`],
  ];
  return `<nav class="tabs" aria-label="${esc(a.title)} sections"><ul>${t.map(([k, l, u, s]) => `<li><a href="${u}"${page === k ? ' aria-current="page"' : ''}>${l}<small>${s}</small></a></li>`).join('')}</ul></nav>`;
}
function footer(site) {
  return `<footer class="ftr">
    <div class="ftr__band"><div class="wrap"><span class="disp">${esc(site.name)}</span><a class="pill pill--ink" href="${site.cta.href}">${esc(site.cta.label)} ${ms('arrow_forward')}</a></div></div>
    <div class="wrap ftr__in">
      <div><a class="brand" href="/">${ms(siteIcon(site), 'ms--fill')}<span>${esc(site.short)}</span></a><p class="ftr__tag" style="margin-block-start:.75rem">${esc(site.tagline)}</p></div>
      ${site.footer.map(col => `<div><h2>${esc(col.title)}</h2><ul>${col.links.map(l => `<li><a href="${l.href}">${esc(l.label)}</a></li>`).join('')}</ul></div>`).join('')}
    </div>
    <div class="wrap ftr__legal"><span>© 2026 ${esc(site.name)}</span><span>${esc(site.domain)}</span><span>Requirement text © Scouting America</span></div>
  </footer>`;
}
const frame = (site, extra='') => `<div class="frame"><img src="${site.hero.image}" alt="${esc(site.hero.alt)}" width="900" height="720">${extra}</div>`;

/* ---------- home ---------- */
function homeMBU(site, ctx) {
  const c = site.counts;
  const cats = site.categories.map((k, i) => `<a class="tile" href="${k.url}" style="${tone(i)}">${ms(icon(k.icon))}<span><b>${esc(k.name)}</b><small>${plural(k.count, 'badge')}</small></span></a>`).join('');
  const patch = b => `<a class="patch" href="${b.url}"><img src="${b.emblem}" alt="${esc(b.title)} merit badge emblem" width="320" height="320" loading="lazy">${b.eagle ? `<span class="stamp stamp--red">Eagle</span>` : ''}<span class="patch__body"><b>${esc(b.title)}</b><small>${esc(b.category)} · ${plural(b.reqCount, 'requirement')}</small></span></a>`;
  return header(site, ctx) + `<main id="main">
  <section class="wrap poster">
    <div>
      <h1>Find any <em>merit badge</em> requirement</h1>
      <p class="poster__lede">${esc(site.tagline)} Read the official text, work through the ${esc(site.guideLabel)}, and print the worksheet for your counselor.</p>
      ${searchForm(site, 'bigsearch')}
      <div class="poster__actions"><a class="pill pill--green" href="${site.cta.href}">${ms('grid_view')} All ${c.badges} badges</a><a class="pill pill--red" href="/merit-badges/eagle-required/">${ms('military_tech')} ${c.eagleBadges} Eagle-required</a><a class="pill" href="/search/">${ms('search')} Search requirements</a></div>
    </div>
    ${frame(site, `<span class="stamp stamp--gold">${c.categories} categories</span><span class="frame__count"><b>${c.badges}</b><small>merit badges</small></span>`)}
  </section>
  <section class="sec sec--panel" aria-labelledby="h-cats"><div class="wrap">
    <div class="sec__head"><h2 id="h-cats">Browse by category</h2><p>${c.categories} fields of interest. Every badge lives in exactly one.</p></div>
    <div class="tilewall">${cats}</div>
  </div></section>
  <section class="sec sec--green" aria-labelledby="h-eagle"><div class="wrap">
    <div class="sec__head"><h2 id="h-eagle">${ms('military_tech', 'ms--fill')} Eagle-required</h2><p>${c.eagleBadges} badges on the Eagle Scout trail, ${c.eagle} of them are category picks. Swipe the rail.</p><a class="pill pill--gold" href="/merit-badges/eagle-required/strategy/">Eagle badge strategy ${ms('arrow_forward')}</a></div>
    <div class="rail" tabindex="0" aria-label="Eagle-required merit badges">${site.eagle.map(patch).join('')}</div>
  </div></section>
  <section class="sec sec--tan" aria-labelledby="h-steps"><div class="wrap">
    <div class="sec__head"><h2 id="h-steps">What's on a badge page</h2></div>
    <div class="steps">${site.steps.map((s, i) => `<div class="step"><span class="num" aria-hidden="true">${i + 1}</span><div><h3>${ms(icon(s.icon))} ${esc(s.title)}</h3><p>${esc(s.text)}</p></div></div>`).join('')}</div>
  </div></section>
  <section class="sec" aria-labelledby="h-more"><div class="wrap">
    <div class="sec__head"><h2 id="h-more">More to explore</h2><p>Featured and recently updated badges across the catalogue.</p><a class="pill" href="${site.cta.href}">${esc(site.cta.label)} ${ms('arrow_forward')}</a></div>
    <div class="rail" tabindex="0" aria-label="More merit badges">${[...site.featured, ...site.more].map(patch).join('')}</div>
  </div></section>
  </main>` + footer(site);
}
function homeSU(site, ctx) {
  const stripe = r => `<a class="stripe" href="${r.url}" style="${tone(r.level - 1)}">
    <span class="stripe__lvl">${r.level}<small>of ${site.counts.ranks}</small></span>
    <h3>${esc(r.title)}<small>${plural(r.leafCount, 'requirement')} in ${plural(r.groups, 'group')}</small></h3>
    <ul aria-label="Sample requirement groups">${r.samples.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
    ${ms('arrow_forward')}</a>`;
  const phase = (p, i, ranks) => `<section class="phase phase--${i + 1}" aria-labelledby="h-phase${i}"><div class="wrap">
    <div class="phase__head"><span class="stamp ${i ? 'stamp--gold' : 'stamp--red'} stamp--big">Ranks ${esc(p.ranks)}</span><h2 id="h-phase${i}">${esc(p.title)}</h2><p>${esc(p.text)}</p></div>
    <div class="stripes">${ranks.map(stripe).join('')}</div>
  </div></section>`;
  return header(site, ctx) + `<main id="main">
  <section class="wrap trail-head">
    <div>
      <h1>The trail <em>to Eagle</em></h1>
      <p class="poster__lede">${esc(site.tagline)} Seven ranks, earned in order, each with its official requirements and a ${esc(site.guideLabel)}.</p>
      ${searchForm(site, 'bigsearch')}
      <div class="poster__actions"><a class="pill pill--green" href="${site.cta.href}">${ms('flag')} ${esc(site.cta.label)}</a><a class="pill pill--red" href="/scouts-bsa/ranks/eagle/">${ms('military_tech')} Eagle Scout</a><a class="pill" href="/scouts-bsa/field-guides/">${ms('menu_book')} Field guides</a></div>
    </div>
    ${frame(site, `<span class="stamp stamp--gold">Scouts BSA</span><span class="frame__count"><b>${site.counts.ranks}</b><small>ranks</small></span>`)}
  </section>
  ${phase(site.phases[0], 0, site.ranks.filter(r => r.level <= 4))}
  ${phase(site.phases[1], 1, site.ranks.filter(r => r.level >= 5))}
  <section class="sec" aria-labelledby="h-fg"><div class="wrap">
    <div class="sec__head"><h2 id="h-fg">Field guides</h2><p>Skills that span several ranks, written once and linked from every requirement that needs them.</p></div>
    <div class="fguides">${site.fieldGuides.map((g, i) => `<a class="btn" href="${g.url}" style="${tone(i + 1)}"><span>${esc(g.title)}</span>${ms('arrow_forward')}</a>`).join('')}</div>
  </div></section>
  </main>` + footer(site);
}
const home = (site, ctx) => isMBU(site) ? homeMBU(site, ctx) : homeSU(site, ctx);

/* ---------- award ---------- */
function award(site, ctx) {
  const a = site.award, mbu = isMBU(site), t = awardTone(site);
  const stickers = mbu ? [
      a.eagle ? ['Eagle required', 'stamp--red'] : null,
      [plural(a.reqCount, 'requirement'), 'stamp--ink'], [esc(a.category), ''], [`${a.guidePages} guide pages`, 'stamp--gold'], [`Updated ${esc(a.updated)}`, ''],
    ] : [
      [`Rank ${a.level} of ${a.totalLevels}`, 'stamp--red'], [plural(a.reqCount, 'requirement'), 'stamp--ink'], [plural(a.groupCount, 'group'), ''], [`${a.guidePages} guide pages`, 'stamp--gold'], [`Updated ${esc(a.updated)}`, ''],
    ];
  const emblem = mbu
    ? `<div class="emblem-block" style="${t}"><img src="${a.emblem}" alt="${esc(a.title)} merit badge emblem" width="320" height="320">${a.eagle ? '<span class="stamp stamp--red stamp--big">Eagle</span>' : ''}</div>`
    : `<div class="emblem-block" style="${t}"><span class="lvl-label">${esc(a.program)} rank</span><span class="lvl" aria-label="Rank ${a.level} of ${a.totalLevels}">${a.level}<sub>/${a.totalLevels}</sub></span></div>
       <div class="rankrow" aria-hidden="true">${Array.from({ length: a.totalLevels }, (_, i) => `<span style="${tone(i)}" class="${i + 1 === a.level ? 'is-now' : ''}"></span>`).join('')}</div>`;
  const side = mbu
    ? `<div class="btnrow" style="margin-block-start:1rem;grid-template-columns:1fr"><a class="btn" href="${site.categories[catIndex(site, a.category)].url}" style="background:var(--c);color:var(--on);${t}"><span>${esc(a.category)}<small>${plural(site.categories[catIndex(site, a.category)].count, 'badge')} in this category</small></span>${ms(icon(a.categoryIcon))}</a>${a.eagle ? `<a class="btn" href="/merit-badges/eagle-required/"><span>Eagle-required list<small>All ${site.counts.eagleBadges} badges</small></span>${ms('military_tech')}</a>` : ''}</div>`
    : `<div class="neighbors" style="margin-block-start:1rem">${a.prev ? `<a class="btn" href="${a.prev.url}"><span><small style="margin:0 0 .35em">Previous rank</small>${esc(a.prev.title)}</span>${ms('arrow_back')}</a>` : ''}${a.next ? `<a class="btn btn--green" href="${a.next.url}"><span><small style="margin:0 0 .35em">Next rank</small>${esc(a.next.title)}</span>${ms('arrow_forward')}</a>` : ''}</div>`;
  const resources = mbu ? [
      ['Requirements', plural(a.reqCount, 'official requirement'), a.requirementsUrl, 'btn--green', 'format_list_numbered'],
      [site.guideLabel, `${a.guidePages} pages`, a.guideUrl, 'btn--gold', 'menu_book'],
      ['Worksheet PDF', 'Fillable, for your counselor', a.worksheetUrl, '', 'picture_as_pdf'],
      ['Official requirements', 'scouting.org', a.officialUrl, '', 'open_in_new'],
      ['Merit badge pamphlet', 'PDF from Scouting America', a.pamphletUrl, '', 'open_in_new'],
      ['Print the guide', 'One long page', a.guidePrintUrl, '', 'print'],
    ] : [
      ['Requirements', `${plural(a.reqCount, 'requirement')} in ${plural(a.groupCount, 'group')}`, a.requirementsUrl, 'btn--green', 'format_list_numbered'],
      [site.guideLabel, `${a.guidePages} pages`, a.guideUrl, 'btn--gold', 'menu_book'],
      ['Print the guide', 'One long page', a.guidePrintUrl, '', 'print'],
      ['All ranks', `${site.counts.ranks} ranks, Scout to Eagle`, site.cta.href, '', 'flag'],
    ];
  const todo = a.requirements.map(r => `<li style="${t}"><a href="${a.requirementsUrl}#req-${r.path}">${esc(r.title || `Requirement ${r.path}`)}</a><small>${r.children.length ? plural(r.children.length, 'part') : ''}${r.mode && r.mode.type === 'select' ? ` · pick ${r.mode.count}` : ''}</small></li>`).join('');
  return header(site, ctx) + tabs(site, 'award') + `<main id="main"><div class="wrap">${crumbs(site, 'award')}
  <section class="award">
    <div>
      <h1><small>${esc(a.label)}${mbu ? ` · ${esc(a.category)}` : ` · ${esc(a.program)}`}</small>${esc(a.title)}</h1>
      <p class="award__desc">${esc(a.description)}</p>
      <div class="stickers">${stickers.filter(Boolean).map(([l, c]) => `<span class="stamp ${c}">${l}</span>`).join('')}</div>
      <div class="btnrow">${resources.map(([l, s, u, c, i]) => `<a class="btn ${c}" href="${u}"><span>${esc(l)}<small>${esc(s)}</small></span>${ms(i)}</a>`).join('')}</div>
    </div>
    <aside aria-label="${mbu ? 'Emblem and category' : 'Rank position'}">${emblem}${side}</aside>
  </section>
  <section class="sec" aria-labelledby="h-todo">
    <div class="sec__head"><h2 id="h-todo">What you'll do</h2><p>${plural(a.requirements.length, 'top-level requirement')}. Our short titles, the official text is one tap away.</p><a class="pill pill--green" href="${a.requirementsUrl}">Read the requirements ${ms('arrow_forward')}</a></div>
    <ol class="todo">${todo}</ol>
  </section>
  ${!mbu && a.footerNote ? `<div class="note"><span class="stamp stamp--ink">Official notes</span><div class="vb">${a.footerNote}</div></div>` : ''}
  </div></main>` + footer(site);
}

/* ---------- requirements ---------- */
function moreRow(node) {
  if (!node.resources || !node.resources.length) return '';
  return `<div class="more"><span class="kick">More</span>${node.resources.map(r => `<a href="${r.url}">${ms(resIcon(r.title))}<span>${esc(r.title)}</span></a>`).join('')}</div>`;
}
function vlist(node) {
  if (!node.list) return '';
  return `<ul class="vlist" aria-label="Items listed in requirement ${esc(node.path)}">${node.list.items.map(i => `<li><span>${i}</span></li>`).join('')}</ul>`;
}
function guideLink(node, site) {
  return node.guide ? `<a class="guidelink" href="${node.guide}">${ms('menu_book')} Guide</a>` : '';
}
function choice(node, site) {
  return `<div class="choice" id="req-${esc(node.path)}"><span class="choice__m" aria-hidden="true">${esc(node.marker)}</span><span class="pathtag">${esc(node.path)}</span>
    <div class="vb">${node.title ? `<strong>${esc(node.title)}.</strong> ` : ''}${vtext(node)}</div>${vlist(node)}${moreRow(node)}${node.guide ? `<div>${guideLink(node, site)}</div>` : ''}</div>`;
}
function children(node, site, depth) {
  if (!node.children.length) return '';
  const select = node.mode && node.mode.type === 'select';
  if (select) return `<div class="choices ${node.children.length > 4 ? 'choices--many' : ''}" role="list" aria-label="Choose ${node.mode.count} of ${node.children.length}">${node.children.map(c => choice(c, site)).join('')}</div>`;
  return `<div class="rows">${node.children.map(c => row(c, site, depth + 1)).join('')}</div>`;
}
function row(node, site, depth) {
  const stamp = node.mode ? `<span class="stamp ${node.mode.type === 'select' ? 'stamp--red' : 'stamp--green'}">${modeLabel(node.mode)}</span>` : '';
  const kids = node.children.length ? `<div class="subreq">${stamp}${children(node, site, depth)}</div>` : '';
  return `<div class="row ${depth > 1 ? 'row--deep' : ''}" id="req-${esc(node.path)}">
    <span class="row__m" aria-hidden="true">${esc(node.marker)}</span>
    <div class="row__c">
      <div class="row__head"><span class="pathtag">${esc(node.path)}</span>${node.title ? `<h3>${esc(node.title)}</h3>` : ''}${guideLink(node, site)}</div>
      ${node.text ? `<div class="vb">${vtext(node)}</div>` : ''}${vlist(node)}${kids}${moreRow(node)}
    </div></div>`;
}
function reqBlock(node, i, site) {
  const stem = node.children.length && /^(Do the following:|)$/.test(node.text.trim());
  const stamp = node.mode ? `<span class="stamp stamp--big req__mode ${node.mode.type === 'select' ? 'stamp--red' : 'stamp--green'}">${modeLabel(node.mode)}</span>` : '';
  return `<article class="req" id="req-${esc(node.path)}" aria-labelledby="req-h-${esc(node.path)}">
    ${stamp}
    <header class="req__band ${stem ? 'req__band--stem' : ''}" style="${tone(i)}">
      <span class="req__num" aria-hidden="true">${esc(node.marker)}</span>
      <div class="req__title"><span class="kick">Requirement ${esc(node.path)}${node.children.length ? ` · ${plural(node.children.length, 'part')}` : ''}</span><h2 id="req-h-${esc(node.path)}">${esc(node.title || `Requirement ${node.path}`)}</h2></div>
    </header>
    <div class="req__body">
      ${node.guide ? `<div style="margin-block-end:.75rem">${guideLink(node, site)}</div>` : ''}
      ${node.text ? `<div class="vb ${stem ? 'vb--stem' : 'vb--lead'}">${vtext(node)}</div>` : ''}
      ${vlist(node)}
      ${children(node, site, 1)}
      ${moreRow(node)}
    </div></article>`;
}
function requirements(site, ctx) {
  const a = site.award, mbu = isMBU(site);
  const sideLinks = mbu
    ? `<a class="pill pill--gold" href="${a.worksheetUrl}">${ms('picture_as_pdf')} Worksheet</a><a class="pill" href="${a.officialUrl}">${ms('open_in_new')} Official source</a>`
    : `<a class="pill pill--gold" href="${a.guidePrintUrl}">${ms('print')} Print guide</a><a class="pill" href="${site.cta.href}">${ms('flag')} All ranks</a>`;
  return header(site, ctx) + tabs(site, 'requirements') + `<main id="main"><div class="wrap">${crumbs(site, 'requirements')}
  <div class="pagehead">
    <div><h1><small>${esc(a.title)} ${esc(a.label)}${mbu && a.eagle ? ' · Eagle required' : ''}${!mbu ? ` · Rank ${a.level} of ${a.totalLevels}` : ''}</small>Requirements</h1>
      <p>${plural(a.reqCount, 'requirement')}${!mbu ? ` in ${plural(a.groupCount, 'group')}` : ''}. Official Scouting America wording, updated ${esc(a.updated)}.</p></div>
    <div class="pagehead__side">${sideLinks}</div>
  </div>
  <div class="legend" aria-label="How to read this page"><span><i class="is-band"></i> Colour band: our short title</span><span><i class="is-panel"></i> Light panel: the official requirement text, verbatim</span><span><span class="stamp" style="font-size:.65rem">Stamp</span> how the parts must be completed</span></div>
  <div class="reqs">${a.requirements.map((r, i) => reqBlock(r, i, site)).join('')}</div>
  ${!mbu && a.footerNote ? `<div class="note"><span class="stamp stamp--ink">Official notes</span><div class="vb">${a.footerNote}</div></div>` : ''}
  ${!mbu && a.footnotes && a.footnotes.length ? `<ol class="vb" style="margin-block-start:1rem">${a.footnotes.map(f => `<li>${f}</li>`).join('')}</ol>` : ''}
  <div class="arrows"><a class="arrow" href="${a.url}">${ms('arrow_back')}<span><span class="kick">Overview</span><b>${esc(a.title)} ${esc(a.label)}</b></span></a><a class="arrow arrow--next" href="${a.guideUrl}"><span><span class="kick">Next</span><b>${esc(site.guideLabel)}</b></span>${ms('arrow_forward')}</a></div>
  </div></main>` + footer(site);
}

/* ---------- guide ---------- */
function gblock(b, site) {
  switch (b.type) {
    case 'p': return `<p>${b.html}</p>`;
    case 'h2': return `<h2>${esc(b.text)}</h2>`;
    case 'h3': return `<h3>${esc(b.text)}</h3>`;
    case 'ul': return `<ul>${b.items.map(i => `<li><span>${i}</span></li>`).join('')}</ul>`;
    case 'ol': return `<ol>${b.items.map(i => `<li><span>${i}</span></li>`).join('')}</ol>`;
    case 'tip': return `<aside class="bleed band band--tip" aria-label="Tip"><span class="stamp stamp--ink">Tip</span><div class="vb">${b.html}</div></aside>`;
    case 'safety': return `<aside class="bleed band band--safety" aria-label="Safety first"><span class="stamp stamp--ink">Safety first</span><div class="vb">${b.html}</div></aside>`;
    case 'be-prepared': return `<aside class="bleed band band--prep" aria-label="Be prepared"><span class="stamp ${b.safety ? 'stamp--red' : 'stamp--ink'}">Be prepared</span><h3>${esc(b.title)}</h3><ol>${b.items.map(i => `<li><span>${i}</span></li>`).join('')}</ol></aside>`;
    case 'checklist': return `<aside class="bleed band band--check" aria-label="Checklist"><span class="stamp stamp--ink">Checklist</span><h3>${esc(b.title)}</h3>${b.subtitle ? `<small>${esc(b.subtitle)}</small>` : ''}<ul>${b.items.map(i => `<li><span>${i}</span></li>`).join('')}</ul></aside>`;
    case 'image': return `<figure class="zfig"><img src="${b.src}" width="${b.width}" height="${b.height}" alt="${esc(b.alt)}">${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>`;
    case 'video': return `<a class="poster-card" href="${b.url}"><span class="poster-card__ic">${ms('play_arrow', 'ms--fill')}</span><span class="poster-card__b"><small>Video · ${esc(b.channel)}</small><b>${esc(b.title)}</b><span>Opens on YouTube in a new tab</span></span></a>`;
    case 'external-link': return `<a class="poster-card poster-card--link" href="${b.url}"><span class="poster-card__ic">${ms('open_in_new')}</span><span class="poster-card__b"><small>External link</small><b>${esc(b.title)}</b><span>${esc(b.description)}</span></span></a>`;
    case 'next-page': return `<a class="nextpage" href="${b.url}"><span class="kick">${esc(b.text)}</span><b>${esc(b.title)}</b><span>${esc(b.teaser)}</span></a>`;
    default: return '';
  }
}
function chapterStrip(site) {
  const g = site.guide, nav = site.award.guideNav;
  const curGroup = nav.find(grp => grp.items.some(it => it.url === g.url)) || nav[0];
  const chap = grp => { const m = grp.title.match(/^(\d+)\.\s*(.*)$/); const num = m ? m[1] : null, title = m ? m[2] : grp.title; const cur = grp === curGroup;
    return `<a class="chap" href="${grp.items[0].url}"${cur ? ' aria-current="true"' : ''}><small>${num ? `Chapter ${num}` : 'Start'} · ${plural(grp.items.length, 'page')}</small><b>${esc(title)}</b></a>`; };
  const pages = curGroup.items.map(it => `<a class="chap" href="${it.url}"${it.url === g.url ? ' aria-current="true"' : ''}><small>${it.path ? esc(it.path) : 'Intro'}</small><b>${esc(it.title)}</b></a>`).join('');
  return `<nav class="chapters" aria-label="${esc(site.guideLabel)} chapters"><div class="wrap chapters__in"><span class="kick">Chapters</span>${nav.map(chap).join('')}</div></nav>
    <nav class="chapters" aria-label="Pages in ${esc(curGroup.title)}"><div class="wrap chapters__in"><span class="kick">${esc(curGroup.title)}</span>${pages}</div></nav>`;
}
function guide(site, ctx) {
  const g = site.guide, a = site.award;
  return header(site, ctx) + tabs(site, 'guide') + chapterStrip(site) + `<main id="main">
  <div class="wrap">${crumbs(site, 'guide')}</div>
  <section class="gtitle" style="${awardTone(site)}"><div class="wrap gtitle__in">
    <div><p class="kick"><b>${esc(g.path)}</b>${esc(g.kicker)}</p><h1>${esc(g.title)}</h1></div>
    <blockquote class="quote"><span class="stamp stamp--ink">Official requirement</span><span class="pathtag">${esc(a.title)} ${esc(g.requirement.number)}</span><div class="vb">${esc(g.requirement.text)}</div>
      <div class="quote__foot"><span>Verbatim from Scouting America</span><a href="${a.requirementsUrl}#req-${esc(g.path)}">See it in the full list ${ms('arrow_forward')}</a></div></blockquote>
  </div></section>
  <article class="zine">${g.blocks.map(b => gblock(b, site)).join('')}</article>
  <div class="wrap"><nav class="arrows" aria-label="Guide pages">
    ${g.prev ? `<a class="arrow" href="${g.prev.url}">${ms('arrow_back')}<span><span class="kick">Previous</span><b>${esc(g.prev.title)}</b></span></a>` : '<span></span>'}
    ${g.next ? `<a class="arrow arrow--next" href="${g.next.url}"><span><span class="kick">Next</span><b>${esc(g.next.title)}</b></span>${ms('arrow_forward')}</a>` : ''}
  </nav></div>
  </main>` + footer(site);
}

/* ---------- search ---------- */
function search(site, ctx) {
  const s = site.search, q = s.query, mbu = isMBU(site);
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\w*)`, 'ig');
  const hl = t => esc(t).replace(re, '<mark>$1</mark>');
  const hits = s.results.reduce((n, r) => n + r.hits.length, 0);
  const tile = (r, i) => `<section class="stile" aria-labelledby="st-${r.slug}">
    <a class="stile__head" href="${r.url}" style="${mbu ? tone(catIndex(site, r.category)) : tone(r.level - 1)}">
      ${r.emblem ? `<img src="${r.emblem}" alt="" width="80" height="80" loading="lazy">` : `<span class="lvl" aria-hidden="true">${r.level}<small>of ${site.counts.ranks}</small></span>`}
      <span class="stile__t"><h2 id="st-${r.slug}">${esc(r.title)} ${esc(site.awardLabel)}</h2><small>${mbu ? `${esc(r.category)}${r.eagle ? ' · Eagle required' : ''} · ${plural(r.reqCount, 'requirement')}` : `Rank ${r.level} of ${site.counts.ranks}`} · ${plural(r.hits.length, 'hit')}</small></span></a>
    <ol class="hits">${r.hits.map(h => `<li class="hit" style="${mbu ? tone(catIndex(site, r.category)) : tone(r.level - 1)}"><span class="pathtag">${esc(h.path)}</span><a href="${r.url}requirements/#req-${esc(h.path)}">${h.title ? `<b>${esc(h.title)}</b>` : ''}<p>${hl(h.excerpt)}</p></a></li>`).join('')}</ol>
  </section>`;
  return header(site, ctx) + `<main id="main"><div class="wrap">${crumbs(site, 'search')}
  <div class="shead">
    <p class="kick">Search requirements · ${esc(s.description)}</p>
    <h1><q>${esc(q)}</q></h1>
    <div class="shead__row"><span class="stamp stamp--red stamp--big">${plural(s.total, site.awardLabel.toLowerCase())}</span><span class="stamp stamp--gold stamp--big">${plural(hits, 'hit')}</span><p>Matches in official requirement text and our titles. Tap a hit to open it in the full list.</p></div>
    ${searchForm(site, 'bigsearch', q)}
  </div>
  <div class="stiles">${s.results.map(tile).join('')}</div>
  </div></main>` + footer(site);
}

window.OPTION = {
  key: 'D', name: 'Patrol Poster', thesis: 'Flat printed-poster energy: giant numbers, colour blocks, stamps and stickers from patrol culture.',
  render: { home, award, requirements, guide, search },
  mount(ctx, app) {
    app.querySelector('[data-toggle-theme]')?.addEventListener('click', () => window.PROTO.go({ theme: ctx.dark ? 'light' : 'dark' }));
    app.querySelectorAll('form[role="search"]').forEach(f => f.addEventListener('submit', e => { e.preventDefault(); window.PROTO.go({ page: 'search' }); }));
  }
};
})();
</script>
<script src="proto.js"></script>
</body>
</html>
