<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Option G · Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<link rel="stylesheet" href="proto.css">
<script src="data.js"></script>
<style>
/* DESIGN PLAN — Option G “Atlas”
   A spatial reference instrument. Tokens: --bone (surfaces 0/1/2), --ink (graphite, 3 steps), --green (deep Scouting
   green, primary), --gold (brass ticks/fills) + --gold-ink (gold as text), --line (hairline). Dark = black-green
   instrument glass, luminous gold ticks. Type: --display Sora (titles, labels, numerals) · --body Atkinson Hyperlegible
   (prose and all verbatim requirement text). Verbatim text = body font on a green left rule with an OFFICIAL tag;
   curated titles = Sora semibold. No third face.
   Home: MBU radial atlas of 14 categories (spoke length ∝ count) with 17 Eagle emblems in orbit; SU 7-segment rank dial
   climbing to Eagle at the summit, phases as inner ring. Award: requirement wheel, instrument readouts, resource toolbar.
   Requirements: split instrument (tracklist + detail panes, all rendered, :target/no-JS). Guide: chapter dial + sticky
   requirement card + scrolling prose, <dialog> lightbox. Search: palette expanded — chips + two-pane finder.
   Chrome: thin instrument bar, ⌘K palette <dialog> on every page, sticky dial strip on award/requirements/guide. */
:root{
  --bone:oklch(0.965 0.006 95); --bone-1:oklch(0.935 0.008 95); --bone-2:oklch(0.90 0.01 95);
  --ink:oklch(0.23 0.012 230); --ink-2:oklch(0.44 0.012 230); --ink-3:oklch(0.56 0.012 230);
  --green:oklch(0.40 0.085 155); --green-2:oklch(0.52 0.09 155); --green-wash:oklch(0.92 0.03 155);
  --gold:oklch(0.76 0.13 85); --gold-ink:oklch(0.46 0.11 80); --gold-wash:oklch(0.94 0.05 90);
  --line:oklch(0.84 0.01 95); --line-2:oklch(0.74 0.012 95);
  --safety:oklch(0.50 0.17 28); --safety-wash:oklch(0.95 0.03 28); --mark:oklch(0.90 0.12 95);
  --glass:oklch(0.99 0.003 95);
  --display:"Sora",ui-sans-serif,system-ui,sans-serif; --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --gutter:max(16px,env(safe-area-inset-left,0px)); --measure:68ch; --r:6px;
  --shadow:0 1px 2px oklch(0 0 0/.06),0 8px 24px -12px oklch(0 0 0/.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bone:oklch(0.17 0.014 165); --bone-1:oklch(0.21 0.016 165); --bone-2:oklch(0.26 0.018 165);
  --ink:oklch(0.93 0.01 95); --ink-2:oklch(0.76 0.012 95); --ink-3:oklch(0.64 0.012 95);
  --green:oklch(0.74 0.10 155); --green-2:oklch(0.62 0.09 155); --green-wash:oklch(0.27 0.035 160);
  --gold:oklch(0.82 0.14 88); --gold-ink:oklch(0.84 0.13 88); --gold-wash:oklch(0.30 0.05 85);
  --line:oklch(0.31 0.016 165); --line-2:oklch(0.40 0.018 165);
  --safety:oklch(0.78 0.13 30); --safety-wash:oklch(0.28 0.04 28); --mark:oklch(0.45 0.10 85);
  --glass:oklch(0.20 0.015 165);
  --shadow:0 1px 2px oklch(0 0 0/.4),0 10px 30px -12px oklch(0 0 0/.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bone:oklch(0.17 0.014 165); --bone-1:oklch(0.21 0.016 165); --bone-2:oklch(0.26 0.018 165);
  --ink:oklch(0.93 0.01 95); --ink-2:oklch(0.76 0.012 95); --ink-3:oklch(0.64 0.012 95);
  --green:oklch(0.74 0.10 155); --green-2:oklch(0.62 0.09 155); --green-wash:oklch(0.27 0.035 160);
  --gold:oklch(0.82 0.14 88); --gold-ink:oklch(0.84 0.13 88); --gold-wash:oklch(0.30 0.05 85);
  --line:oklch(0.31 0.016 165); --line-2:oklch(0.40 0.018 165);
  --safety:oklch(0.78 0.13 30); --safety-wash:oklch(0.28 0.04 28); --mark:oklch(0.45 0.10 85);
  --glass:oklch(0.20 0.015 165);
  --shadow:0 1px 2px oklch(0 0 0/.4),0 10px 30px -12px oklch(0 0 0/.7);
  color-scheme:dark}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bone);color:var(--ink);font:400 1rem/1.55 var(--body);font-variant-numeric:tabular-nums;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;background-attachment:fixed;background-position:center top}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 0%,transparent 0%,var(--bone) 70%);pointer-events:none}
body{background-blend-mode:normal}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,1.2rem + 2.6vw,3.2rem);font-weight:700}
h2{font-size:clamp(1.25rem,1rem + 1vw,1.7rem);font-weight:600}
h3{font-size:1.1rem;font-weight:600}
p{margin:0;text-wrap:pretty}
a{color:var(--green);text-decoration-color:color-mix(in oklch,var(--green) 40%,transparent);text-underline-offset:.15em}
a:hover{text-decoration-color:currentColor}
img{max-width:100%;height:auto;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}
mark{background:var(--mark);color:var(--ink);padding-inline:.1em;border-radius:2px}
kbd{font:600 .7rem/1 var(--display);padding:.2em .4em;border:1px solid var(--line-2);border-block-end-width:2px;border-radius:4px;background:var(--glass);color:var(--ink-2)}
.ms{font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-size:1.25em;line-height:1;display:inline-block;vertical-align:-.2em;flex:none}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:var(--gutter)}
.lbl{font:600 .68rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.lbl.gold{color:var(--gold-ink)} .lbl.green{color:var(--green)}
.num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.vt{view-transition-name:award-id}
.vh{position:absolute!important;clip:rect(0 0 0 0);width:1px;height:1px;overflow:hidden;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
::view-transition-old(award-id),::view-transition-new(award-id){animation-duration:.35s}

/* ---------- instrument bar (header) ---------- */
.bar{position:sticky;top:0;z-index:40;background:color-mix(in oklch,var(--glass) 88%,transparent);backdrop-filter:blur(10px);border-block-end:1px solid var(--line)}
.bar__in{display:flex;align-items:center;gap:8px;min-height:52px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:600 1rem/1 var(--display);letter-spacing:-.01em;min-width:0}
.brand svg{flex:none}
.brand b{font-weight:700;white-space:nowrap}
.brand small{display:block;font:500 .66rem/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-block-start:3px}
.bar__nav{display:flex;align-items:center;gap:2px;margin-inline-start:12px}
.bar__nav a{color:var(--ink-2);text-decoration:none;font:500 .85rem/1 var(--display);padding:8px 10px;border-radius:4px}
.bar__nav a:hover{background:var(--bone-1);color:var(--ink)}
.bar__sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--glass);color:var(--ink);font:500 .85rem/1 var(--display);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--green);border-color:var(--green);color:oklch(0.98 0.005 95)}
:root[data-theme="dark"] .btn.pri{color:oklch(0.15 0.02 160)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:oklch(0.15 0.02 160)}}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ico{padding:0;inline-size:36px;justify-content:center}
.btn.k{color:var(--ink-2);min-width:220px;justify-content:flex-start}
.btn.k kbd{margin-inline-start:auto}
.bar details{position:relative}
.bar summary{list-style:none;cursor:pointer}
.bar summary::-webkit-details-marker{display:none}
.bar .menu{position:absolute;inset-inline-end:0;top:calc(100% + 6px);min-width:220px;padding:6px;display:grid;gap:2px;z-index:50}
.bar .menu a{display:block;padding:8px 10px;color:var(--ink);text-decoration:none;border-radius:4px;font:500 .9rem/1.2 var(--display)}
.bar .menu a:hover{background:var(--bone-1)}
.only-m{display:none}
@media (max-width:760px){.bar__nav,.btn.k,.bar .cta{display:none}.only-m{display:inline-flex}.brand small{display:none}}

/* ---------- command palette ---------- */
.pal{inset:0;margin:auto;margin-block-start:min(12vh,96px);inline-size:min(680px,calc(100% - 32px));padding:0;border:1px solid var(--line-2);border-radius:10px;background:var(--glass);color:var(--ink);box-shadow:0 30px 80px -20px oklch(0 0 0/.5)}
.pal::backdrop{background:oklch(0.15 0.02 165/.55);backdrop-filter:blur(2px)}
.pal__in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-block-end:1px solid var(--line)}
.pal__in input{flex:1;min-width:0;border:0;background:transparent;font:500 1.05rem/1.3 var(--display);color:var(--ink);outline:none}
.pal__in input::placeholder{color:var(--ink-3)}
.pal__list{list-style:none;margin:0;padding:6px;max-block-size:min(56vh,480px);overflow:auto}
.pal__grp{padding:10px 10px 4px;font:600 .66rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.pal__it a{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;min-width:0}
.pal__it a .t{font:500 .92rem/1.25 var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal__it a .t small{display:block;font:400 .8rem/1.3 var(--body);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.pal__it a .p{font:600 .72rem/1 var(--display);color:var(--gold-ink);min-width:2.2em;text-align:end}
.pal__it a .k{font:500 .68rem/1 var(--display);color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.pal__it[aria-selected="true"] a{background:var(--green-wash);color:var(--ink)}
.pal__it a .ms{color:var(--ink-3)}
.pal__empty{padding:28px 14px;text-align:center;color:var(--ink-2)}
.pal__foot{display:flex;gap:14px;flex-wrap:wrap;padding:8px 14px;border-block-start:1px solid var(--line);font:500 .72rem/1 var(--display);color:var(--ink-3)}
.pal__foot span{display:inline-flex;align-items:center;gap:5px}

/* ---------- dial strip ---------- */
.dial{position:sticky;top:52px;z-index:30;background:color-mix(in oklch,var(--bone-1) 92%,transparent);backdrop-filter:blur(8px);border-block-end:1px solid var(--line)}
.dial__in{display:flex;align-items:center;gap:14px;min-height:56px;overflow-x:auto;scrollbar-width:none}
.dial__in::-webkit-scrollbar{display:none}
.dial__id{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.dial__id .t{font:600 .95rem/1.1 var(--display);white-space:nowrap}
.dial__id .t small{display:block;font:500 .64rem/1.3 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-block-start:2px}
.emb{inline-size:36px;block-size:36px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line-2)}
.lvl{inline-size:36px;block-size:36px;flex:none;position:relative;display:grid;place-items:center;font:700 .95rem/1 var(--display);color:var(--ink)}
.lvl svg{position:absolute;inset:0}
.seg{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line-2);border-radius:999px;background:var(--glass);flex:none}
.seg a{text-decoration:none;color:var(--ink-2);font:500 .8rem/1 var(--display);padding:7px 12px;border-radius:999px;white-space:nowrap}
.seg a:hover{color:var(--ink)}
.seg a[aria-current]{background:var(--green);color:oklch(0.98 0.005 95)}
:root[data-theme="dark"] .seg a[aria-current]{color:oklch(0.15 0.02 160)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg a[aria-current]{color:oklch(0.15 0.02 160)}}
.dial__pos{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex:none;color:var(--ink-2);font:500 .78rem/1 var(--display);white-space:nowrap}
.dial__pos b{color:var(--ink);font-weight:600}
.ticks{display:inline-flex;gap:3px;align-items:flex-end;block-size:14px}
.ticks i{display:block;inline-size:2px;block-size:8px;background:var(--line-2);border-radius:1px}
.ticks i.on{background:var(--gold);block-size:14px}

/* ---------- crumbs / page head ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;list-style:none;margin:0;padding:14px 0 0;font:500 .74rem/1 var(--display);letter-spacing:.04em;color:var(--ink-3)}
.crumbs a{color:var(--ink-3);text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.crumbs li+li::before{content:"/";margin-inline-end:6px;color:var(--line-2)}
.crumbs li[aria-current]{color:var(--ink)}
.read{display:grid;gap:2px;padding:10px 12px;border-inline-start:2px solid var(--gold);background:var(--glass);min-width:0}
.read .lbl{font-size:.62rem}
.read b{font:600 1.05rem/1.2 var(--display);color:var(--ink)}
.read b small{font:500 .74rem/1 var(--display);color:var(--ink-2);margin-inline-start:4px}
.reads{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--glass);color:var(--ink-2);font:500 .76rem/1 var(--display);text-decoration:none;white-space:nowrap;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--ink-3)}
.chip.on{background:var(--green-wash);color:var(--green);border-color:transparent}
.chip.gold{background:var(--gold-wash);color:var(--gold-ink);border-color:transparent}
.eagle{display:inline-flex;align-items:center;gap:5px;color:var(--gold-ink);font:600 .68rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.eagle .ms{font-size:1rem;color:var(--gold)}

/* ---------- mode ring + verbatim ---------- */
.ring{inline-size:22px;block-size:22px;flex:none;vertical-align:middle}
.ring text{font:700 9px var(--display);fill:var(--ink)}
.mode{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font:600 .7rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.mode.sel{color:var(--gold-ink)}
.vb{position:relative;border-inline-start:2px solid var(--green);padding-inline-start:14px;max-inline-size:var(--measure);color:var(--ink);font-size:1rem;line-height:1.6}
.vb::before{content:"Official";position:absolute;inset-inline-start:-2px;top:-1.2rem;font:600 .58rem/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.vb.q::before{content:"Official wording"}
.vb ul{margin:.5em 0 0;padding-inline-start:1.1em}
.vb li{margin-block:.2em}
.vb strong{font-weight:700}
.vb br+br{display:none}

/* ---------- popovers (anchored) ---------- */
[popover].pop{position:fixed;inset:auto;margin:0;padding:0;border:1px solid var(--line-2);border-radius:8px;background:var(--glass);color:var(--ink);box-shadow:0 20px 50px -18px oklch(0 0 0/.5);inline-size:min(340px,calc(100vw - 32px));z-index:60}
[popover].pop::backdrop{background:transparent}
.pop__in{padding:12px 14px;display:grid;gap:8px}
.pop__in .lbl{font-size:.6rem}
.pop__in h4{font:600 .95rem/1.25 var(--display)}
.pop__in p{font-size:.9rem;color:var(--ink-2);line-height:1.5}
.pop__in a.btn{justify-self:start}
.pop__links{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.pop__links a{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:4px;text-decoration:none;color:var(--ink);font:500 .88rem/1.3 var(--display)}
.pop__links a:hover{background:var(--bone-1)}
.pop__links .p{color:var(--gold-ink);font:600 .72rem/1 var(--display);min-width:2em}
/* fallback: centred in viewport; anchored when supported */
[popover].pop{inset-inline-start:50%;inset-block-start:50%;translate:-50% -50%}
@supports (anchor-name:--a){
  [popover].pop[data-anchor]{inset:auto;translate:none;position-anchor:var(--anchor);position-area:block-end span-inline-end;margin-block-start:6px;position-try-fallbacks:flip-block,flip-inline,flip-block flip-inline}
}
.pbtn{appearance:none;border:1px solid var(--line-2);background:var(--glass);border-radius:999px;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;font:500 .74rem/1 var(--display);color:var(--green);cursor:pointer;white-space:nowrap}
.pbtn:hover{border-color:var(--green)}
.pbtn .ms{font-size:1rem}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(20px,4vw,56px);align-items:center;padding-block:clamp(28px,5vw,64px) 24px}
.hero__txt{display:grid;gap:18px;min-width:0}
.hero__txt p.lead{font-size:clamp(1.05rem,1rem + .4vw,1.25rem);color:var(--ink-2);max-inline-size:52ch}
.hero__txt .btn.k{min-width:min(420px,100%);min-height:48px;font-size:.95rem}
.hero__txt .reads{max-inline-size:520px}
.map{position:relative;container-type:inline-size;inline-size:100%;overflow:hidden}
.map>svg{display:block;inline-size:100%;block-size:auto}
.map>svg text{font-family:var(--display)}
.map .lab{position:absolute;translate:-50% -50%;display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:4px 7px;border:1px solid transparent;border-radius:6px;background:color-mix(in oklch,var(--glass) 80%,transparent);color:var(--ink);text-decoration:none;font:600 .72rem/1.15 var(--display);text-align:center;cursor:pointer;white-space:nowrap;anchor-name:var(--anchor)}
.map .lab small{font:500 .62rem/1 var(--display);color:var(--ink-3)}
.map .lab:hover,.map .lab:focus-visible{border-color:var(--gold);background:var(--glass)}
.map .orb{position:absolute;translate:-50% -50%;inline-size:34px;block-size:34px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:var(--shadow);background:var(--bone-1)}
.map .orb img{inline-size:100%;block-size:100%;object-fit:cover}
.map .orb:hover,.map .orb:focus-visible{scale:1.15;z-index:2}
.map .labs,.map .orbs{display:contents}
@container (max-width:560px){
  .map .lab,.map .orb{position:static;translate:none}
  .map .labs{display:flex;flex-wrap:wrap;gap:6px;padding-block-start:10px}
  .map .lab{border-color:var(--line-2);flex-direction:row;gap:6px}
  .map .orbs{display:flex;flex-wrap:wrap;gap:6px;padding-block-start:10px}
  .map .orb{inline-size:30px;block-size:30px}
  .map .hide-s{display:none}
}
.sec{padding-block:clamp(28px,4vw,48px);border-block-start:1px solid var(--line)}
.sec__h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-block-end:18px}
.sec__h p{color:var(--ink-2);max-inline-size:60ch}
.sec__h a.more{font:500 .85rem/1 var(--display);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;text-decoration:none;color:var(--ink);min-width:0;transition:border-color .15s}
.card:hover{border-color:var(--green)}
.card .emb{inline-size:48px;block-size:48px}
.card .lvl{inline-size:48px;block-size:48px;font-size:1.2rem}
.card .t{font:600 .95rem/1.2 var(--display);min-width:0}
.card .t small{display:block;font:400 .78rem/1.3 var(--body);color:var(--ink-2);margin-block-start:3px}
.card .t .eagle{margin-block-start:5px}

<script>
(function(){
'use strict';
/* ================= helpers ================= */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id = s => String(s).replace(/[^a-z0-9]+/gi,'-');
const ms = (n, cls='') => `<span class="ms ${cls}" aria-hidden="true">${n}</span>`;
const isMBU = site => site.key==='mbu';
const ICON = {tractor:'agriculture','paint-brush-household':'palette',factory:'factory',broadcast:'cell_tower',recycle:'recycling','puzzle-piece':'extension',binoculars:'nature',compass:'explore',atom:'science',briefcase:'work','hand-heart':'volunteer_activism','soccer-ball':'sports_soccer',wrench:'build','car-simple':'directions_car','list-checks':'checklist',book:'menu_book',trophy:'picture_as_pdf'};
const icon = n => ICON[n] || 'circle';
const DEG = Math.PI/180;
const polar = (cx,cy,r,a) => [cx + r*Math.cos(a*DEG), cy + r*Math.sin(a*DEG)];
const f = n => Math.round(n*100)/100;
function arcPath(cx,cy,r,a0,a1){ const [x0,y0]=polar(cx,cy,r,a0), [x1,y1]=polar(cx,cy,r,a1); const big = (a1-a0)%360 > 180 ? 1 : 0; return `M${f(x0)} ${f(y0)} A${r} ${r} 0 ${big} 1 ${f(x1)} ${f(y1)}`; }
function text(node){ return node.textFormat==='html' ? node.text : esc(node.text); }
function flatReqs(reqs){ const out=[]; const walk=n=>{ out.push(n); n.children.forEach(walk) }; reqs.forEach(walk); return out; }
function flatGuide(nav){ return nav.flatMap(s=>s.items.map(i=>({...i,section:s.title}))); }
const total = site => isMBU(site) ? site.counts.badges : site.counts.ranks;

/* mode ring glyph: select → N segments with count in centre; all → filled ring; null → tick ring */
function ring(mode, n, size=22){
  const r=9, cx=11, cy=11, segs=[];
  if (mode && mode.type==='select' && n>0){
    const gap=14, span=360/n;
    for(let i=0;i<n;i++){ const a0=-90+i*span+gap/2, a1=-90+(i+1)*span-gap/2; segs.push(`<path d="${arcPath(cx,cy,r,a0,a1)}" stroke="var(--gold)" stroke-width="2.5" fill="none" stroke-linecap="round"/>`); }
    segs.push(`<text x="${cx}" y="${cy+3.2}" text-anchor="middle">${mode.count}</text>`);
    return `<svg class="ring" viewBox="0 0 22 22" role="img" aria-label="Choose ${mode.count} of ${n}">${segs.join('')}</svg>`;

  if (mode && mode.type==='all'){

/* label placement around a ring: outward-anchored HTML labels at polar coords (percent of the box) */
function labAt(a, r, cls, inner, extra='', vb){
  const c = Math.cos(a*DEG), s = Math.sin(a*DEG);
  const x = (vb.cx + r*c - vb.x)/vb.w*100, y = (vb.cy + r*s - vb.y)/vb.h*100;
  const tx = Math.abs(c) < .3 ? '-50%' : c > 0 ? '0' : '-100%';
  return `style="left:${f(x)}%;top:${f(y)}%;translate:${tx} -50%;${extra}" class="${cls}"` + inner;
}
function wheel(site){

  const parts = [];

  parts.push(`<circle cx="${cx}" cy="${cy}" r="62" fill="var(--glass)" stroke="var(--line-2)" stroke-width="1"/>`);
  for(let i=0;i<72;i++){ const [x0,y0]=polar(cx,cy,196,i*5),[x1,y1]=polar(cx,cy,i%6?200:206,i*5); parts.push(`<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(x1)}" y2="${f(y1)}" stroke="${i%6?'var(--line-2)':'var(--gold)'}" stroke-width="1"/>`); }
  const labs = [];
  reqs.forEach((r,i)=>{
    const ang = -90 + i*(360/N), n=r.children.length;
    const [x0,y0]=polar(cx,cy,70,ang),[x1,y1]=polar(cx,cy,160,ang),[nx,ny]=polar(cx,cy,176,ang);
    parts.push(`<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(x1)}" y2="${f(y1)}" stroke="var(--ink-3)" stroke-width="1.2"/>`);
    for(let k=0;k<n;k++){ const rr = 84 + (k/(Math.max(n,2)-1))*64; const [px,py]=polar(cx,cy,rr,ang); parts.push(`<circle cx="${f(px)}" cy="${f(py)}" r="3" fill="${r.mode&&r.mode.type==='select'?'var(--gold)':'var(--green)'}"/>`); }
    const sel = r.mode&&r.mode.type==='select';
    parts.push(`<circle cx="${f(nx)}" cy="${f(ny)}" r="15" fill="var(--glass)" stroke="${sel?'var(--gold)':r.mode?'var(--green)':'var(--line-2)'}" stroke-width="2.5" ${sel?'stroke-dasharray="6 4"':''}/>`);
    parts.push(`<text x="${f(nx)}" y="${f(ny)+4.5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${esc(r.path)}</text>`);
    const pid = `pw-${id(r.path)}`, snippet = (r.text||'').replace(/<[^>]+>/g,'');
    labs.push(`<button type="button" popovertarget="pop-${pid}" ${labAt(ang,232,'lab',`><span class="p">${esc(r.path)}</span><span class="t">${esc(r.title||snippet.slice(0,40)||'Requirement '+r.path)}</span>`,`anchor-name:--${pid}`,VB)}</button>
      <div popover class="pop" id="pop-${pid}" data-anchor style="--anchor:--${pid}"><div class="pop__in"><span class="lbl gold">Requirement ${esc(r.path)} · ${n?n+' parts':'single'}</span>${r.title?`<h4>${esc(r.title)}</h4>`:''}${modeLabel(r.mode,n)}${snippet?`<div class="vb nolab" style="margin-block-start:4px">${text(r)}</div>`:`<p>${n} parts — open the requirement for the full wording.</p>`}<a class="btn" href="${a.requirementsUrl}#req-${id(r.path)}">${ms('format_list_numbered')}Open requirement ${esc(r.path)}</a></div></div>`);
  });
  const centre = `<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="30" font-weight="700" fill="var(--ink)">${isMBU(site)?a.reqCount:a.groupCount}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="9" font-weight="600" letter-spacing="1.5" fill="var(--ink-3)">${isMBU(site)?'REQUIREMENTS':'GROUPS · '+a.reqCount+' REQS'}</text>`;

    <section class="sec" aria-labelledby="ovw-h"><div class="sec__h"><h2 id="ovw-h">Requirements at a glance</h2><a class="more" href="${a.requirementsUrl}">Full verbatim list ${ms('arrow_forward')}</a></div><ol class="ovw">${ovw}</ol></section>

/* ================= guide ================= */
function chapterDial(site){
  const a = site.award, g = site.guide, nav = a.guideNav, S=300, cx=150, cy=150;
  const totalItems = nav.reduce((n,s)=>n+s.items.length,0);
  const flat = flatGuide(nav), idx = flat.findIndex(p=>p.url===g.url);
  let ang = -90; const parts = [];
  parts.push(`<circle cx="${cx}" cy="${cy}" r="112" fill="none" stroke="var(--line)" stroke-width="1"/>`);
  nav.forEach((s,i)=>{
    const span = 360*s.items.length/totalItems, a0=ang+1.2, a1=ang+span-1.2, cur = s.items.some(it=>it.url===g.url);
    parts.push(`<a href="${s.items[0].url}"><title>${esc(s.title)} · ${s.items.length} ${s.items.length===1?'page':'pages'}</title><path d="${arcPath(cx,cy,100,a0,a1)}" fill="none" stroke="${cur?'var(--gold)':'var(--green)'}" stroke-opacity="${cur?1:.45}" stroke-width="${cur?16:10}" stroke-linecap="butt"/></a>`);
    s.items.forEach((it,k)=>{ const ta = ang + span*(k+.5)/s.items.length; const [x0,y0]=polar(cx,cy,118,ta),[x1,y1]=polar(cx,cy,it.url===g.url?130:124,ta); parts.push(`<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(x1)}" y2="${f(y1)}" stroke="${it.url===g.url?'var(--gold)':'var(--line-2)'}" stroke-width="${it.url===g.url?2.5:1.2}" stroke-linecap="round"/>`); });
    const [lx,ly]=polar(cx,cy,80,ang+span/2); const lbl = s.title.match(/^\d+/) ? s.title.match(/^\d+/)[0] : '·';
    parts.push(`<text x="${f(lx)}" y="${f(ly)+3}" text-anchor="middle" font-size="9" font-weight="600" fill="${cur?'var(--gold-ink)':'var(--ink-3)'}">${esc(lbl)}</text>`);
    ang += span;
  });
  parts.push(`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">${idx+1}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="8.5" font-weight="600" letter-spacing="1.5" fill="var(--ink-3)">OF ${a.guidePages} PAGES</text>`);
  return `<div class="cdial"><svg viewBox="0 0 ${S} ${S}" role="img" aria-label="Chapter dial: ${nav.length} sections, page ${idx+1} of ${a.guidePages}">${parts.join('')}</svg></div>`;
}
function guideNav(site){
  const g = site.guide;
  return `<nav class="gnav" aria-label="${esc(site.guideLabel)} contents">${site.award.guideNav.map(s=>{ const cur = s.items.some(it=>it.url===g.url);
    return `<details ${cur?'open class="cur"':''}><summary><span class="i" aria-hidden="true"></span><span>${esc(s.title)}</span><span class="c">${s.items.length}</span></summary><ol>${s.items.map(it=>`<li><a href="${it.url}" ${it.url===g.url?'aria-current="page"':''}><span class="p">${esc(it.marker||'•')}</span><span>${esc(it.title)}</span></a></li>`).join('')}</ol></details>`; }).join('')}</nav>`;
}
function call(cls, ico, label, inner){ return `<aside class="call ${cls}">${ms(ico)}<span class="lbl">${label}</span>${inner}</aside>`; }
function block(b){
  switch(b.type){
    case 'p': return `<p>${b.html}</p>`;
    case 'h2': return `<h2>${esc(b.text)}</h2>`;
    case 'h3': return `<h3>${esc(b.text)}</h3>`;
    case 'ul': return `<ul>${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    case 'ol': return `<ol>${b.items.map(i=>`<li>${i}</li>`).join('')}</ol>`;
    case 'tip': return call('tip','lightbulb','Tip',`<p>${b.html}</p>`);
    case 'safety': return call('safety','emergency_home','Safety first',`<p>${b.html}</p>`);
    case 'be-prepared': return call(b.safety?'safety':'','health_and_safety','Be prepared',`<h4>${esc(b.title)}</h4><ul>${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`);
    case 'checklist': return call('','checklist','Checklist',`<h4>${esc(b.title)}</h4>${b.subtitle?`<p>${esc(b.subtitle)}</p>`:''}<ul>${b.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`);
    case 'image': return `<figure><button class="figbtn" type="button" data-lightbox="${b.src}" data-alt="${esc(b.alt)}" aria-label="Enlarge image"><img src="${b.src}" width="${b.width}" height="${b.height}" alt="${esc(b.alt)}"></button><figcaption>${esc(b.caption||b.alt)}</figcaption></figure>`;
    case 'video': return `<a class="vid" href="${b.url}"><span class="play">${ms('play_arrow','fill')}</span><span class="t">${esc(b.title)}<small>Video · ${esc(b.channel)} · opens in a new tab</small></span>${ms('open_in_new','out')}</a>`;
    case 'external-link': return `<a class="vid ext" href="${b.url}"><span class="play">${ms('link')}</span><span class="t">${esc(b.title)}<small>External resource</small></span>${ms('open_in_new','out')}<p>${esc(b.description)}</p></a>`;
    case 'next-page': return `<a class="nextp" href="${b.url}"><span class="lbl">${esc(b.text)}</span><b>Next: ${esc(b.title)}</b><p>${esc(b.teaser)}</p></a>`;
    default: return '';
  }
}
function guide(site, ctx){
  const a = site.award, g = site.guide, flat = flatGuide(a.guideNav), idx = flat.findIndex(p=>p.url===g.url);
  const reqNode_ = flatReqs(a.requirements).find(n=>n.path===g.path);

  return header(site,ctx) + dialStrip(site,'guide',`Page <b>${idx+1}</b> of ${a.guidePages}`) + `<main id="main" class="wrap">${crumbs(site,'guide')}
    <div class="gtop">${chapterDial(site)}${guideNav(site)}</div>
    <div class="gsplit">
      <aside class="gcard panel" aria-label="Requirement ${esc(g.requirement.number)}">

        <div class="vb q">${esc(g.requirement.text)}${reqNode_&&reqNode_.list?`<ul>${reqNode_.list.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}</div>
        ${reqNode_&&reqNode_.resources.length?resources(reqNode_.resources):''}

  </main>
  <dialog class="lb" id="lightbox" aria-label="Image"><figure><img src="" alt=""><figcaption></figcaption></figure><form method="dialog"><button type="submit">Close</button></form></dialog>` + footer(site);

/* ================= search ================= */
function search(site, ctx){
  const s = site.search, q = s.query, mbu = isMBU(site);
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'s?)','ig');
  const hl = t => esc(t).replace(re,'<mark>$1</mark>');
  const hits = s.results.reduce((n,r)=>n+r.hits.length,0);
  const facets = mbu
    ? Object.entries(s.results.reduce((m,r)=>{ m[r.category]=(m[r.category]||0)+1; return m; },{})).map(([k,v])=>({key:id(k),label:k,n:v}))
    : s.results.slice().sort((a,b)=>a.level-b.level).map(r=>({key:'lvl-'+r.level,label:`Rank ${r.level} · ${r.title}`,n:r.hits.length}));
  const fkey = r => mbu ? id(r.category) : 'lvl-'+r.level;
  const ordered = mbu ? s.results : s.results.slice().sort((a,b)=>a.level-b.level);
  const list = ordered.map((r,i)=>`<li data-facet="${fkey(r)}"><a href="#hit-${id(r.slug)}" data-track-go ${i===0?'aria-current="true"':''}>${r.emblem?`<img class="emb" src="${r.emblem}" alt="">`:lvlGlyph(r.level,site.counts.ranks)}<span class="t">${esc(r.title)} ${esc(site.awardLabel)}<small>${mbu?esc(r.category)+(r.eagle?' · Eagle-required':''):'Rank '+r.level+' of '+site.counts.ranks}</small></span><span class="hc">${r.hits.length}</span></a></li>`).join('');
  const panes = ordered.map((r,i)=>`<section class="pane panel ${i===0?'is-current':''}" id="hit-${id(r.slug)}" aria-labelledby="hit-${id(r.slug)}-h">
    <header class="pane__h s">${r.emblem?`<img class="emb" src="${r.emblem}" alt="${esc(r.title)} emblem">`:lvlGlyph(r.level,site.counts.ranks)}<div><h2 id="hit-${id(r.slug)}-h">${esc(r.title)} ${esc(site.awardLabel)}</h2><div class="meta"><span class="lbl">${r.hits.length} ${r.hits.length===1?'hit':'hits'} for “${esc(q)}”</span>${mbu?`<span class="lbl">${esc(r.category)} · ${r.reqCount} requirements</span>`:`<span class="lbl">Rank ${r.level} of ${site.counts.ranks}</span>`}<a class="chip" href="${r.url}">${ms('open_in_new')}${esc(site.awardLabel)} page</a></div></div></header>
    <ol class="hits">${r.hits.map(h=>`<li><a href="${r.url}requirements/#req-${id(h.path)}"><span class="p">${esc(h.path)}</span><span class="t">${h.title?`<b>${esc(h.title)}</b>`:''}<p>${hl(h.excerpt)}</p></span>${ms('arrow_forward')}</a></li>`).join('')}</ol>
  </section>`).join('');
  return header(site,ctx) + `<main id="main" class="wrap">${crumbs(site,'search')}
    <div class="shead"><div><h1>Search requirements</h1><p>${esc(s.description)}</p></div>
      <form class="sform" role="search" data-search-form>${ms('search')}<input type="search" name="q" value="${esc(q)}" aria-label="Search requirements" autocomplete="off"><kbd>/</kbd><button type="submit">Search</button></form>
      <div class="toolbar" data-facets><span class="lbl" style="align-self:center">${mbu?'Category':'Rank'}</span><button class="chip on" type="button" data-facet="all">All · ${s.results.length}</button>${facets.map(fc=>`<button class="chip" type="button" data-facet="${fc.key}">${esc(fc.label)} · ${fc.n}</button>`).join('')}</div>
      <p class="lbl" aria-live="polite" data-summary><b style="color:var(--ink)">${s.total}</b> ${esc(site.awardPlural)} · <b style="color:var(--ink)">${hits}</b> requirement hits for “${esc(q)}”</p></div>
    <div class="finder"><nav aria-label="Matching ${esc(site.awardPlural)}"><ol class="flist" data-track>${list}</ol></nav><div class="panes" data-panes>${panes}</div></div>
  </main>` + footer(site);
}

/* ================= home ================= */
function atlas(site){
  const cats = site.categories, N = cats.length, S=600, cx=300, cy=300, step=360/N, parts=[], labs=[], orbs=[], VB={x:-120,y:-30,w:840,h:660,cx,cy};
  parts.push(`<circle cx="${cx}" cy="${cy}" r="72" fill="var(--glass)" stroke="var(--line-2)"/>`);
  parts.push(`<circle cx="${cx}" cy="${cy}" r="122" fill="none" stroke="var(--gold)" stroke-width="1" stroke-dasharray="2 5"/>`);
  parts.push(`<circle cx="${cx}" cy="${cy}" r="150" fill="none" stroke="var(--line)" stroke-width="1"/>`);
  parts.push(`<circle cx="${cx}" cy="${cy}" r="262" fill="none" stroke="var(--line)" stroke-width="1"/>`);
  cats.forEach((c,i)=>{
    const ang = -90 + i*step, len = 150 + c.count*4.5, pid = `pc-${id(c.name)}`;
    const [x0,y0]=polar(cx,cy,150,ang),[x1,y1]=polar(cx,cy,len,ang);
    parts.push(`<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(x1)}" y2="${f(y1)}" stroke="var(--green)" stroke-width="2"/>`);
    parts.push(`<path d="${arcPath(cx,cy,len,ang-step/2+3,ang+step/2-3)}" fill="none" stroke="var(--green)" stroke-opacity="${.35+.65*c.count/24}" stroke-width="7" stroke-linecap="round"/>`);
    parts.push(`<text x="${f(polar(cx,cy,len+14,ang)[0])}" y="${f(polar(cx,cy,len+14,ang)[1])+3.5}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--gold-ink)">${c.count}</text>`);
    labs.push(`<button type="button" popovertarget="pop-${pid}" ${labAt(ang,288,'lab',`><span>${esc(c.name)}</span><small>${c.count} badges</small>`,`anchor-name:--${pid}`,VB)}</button>
      <div popover class="pop" id="pop-${pid}" data-anchor style="--anchor:--${pid}"><div class="pop__in"><span class="lbl green">Category</span><h4>${ms(icon(c.icon))} ${esc(c.name)}</h4><p>${c.count} of ${site.counts.badges} merit badges.</p><a class="btn" href="${c.url}">Browse ${esc(c.name)}${ms('arrow_forward')}</a></div></div>`);
  });
  site.eagle.forEach((b,i)=>{ const ang = -90 + i*(360/site.eagle.length); const [px,py]=polar(cx,cy,122,ang), x=(px-VB.x)/VB.w*100, y=(py-VB.y)/VB.h*100; orbs.push(`<a class="orb" href="${b.url}" style="left:${f(x)}%;top:${f(y)}%" title="${esc(b.title)} · Eagle-required"><img src="${b.emblem}" alt="${esc(b.title)} merit badge emblem"></a>`); });
  const centre = `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)">${site.counts.badges}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="9" font-weight="600" letter-spacing="1.6" fill="var(--ink-3)">MERIT BADGES</text><text x="${cx}" y="${cy+34}" text-anchor="middle" font-size="8.5" font-weight="600" letter-spacing="1.4" fill="var(--gold-ink)">${site.counts.eagleBadges} EAGLE-REQUIRED IN ORBIT</text>`;
  return `<div class="map" aria-label="Atlas of categories"><svg viewBox="${VB.x} ${VB.y} ${VB.w} ${VB.h}" role="img" aria-label="Radial atlas: ${N} categories as spokes, length proportional to badge count; ${site.eagle.length} Eagle-required badges in orbit">${parts.join('')}${centre}</svg><div class="orbs">${orbs.join('')}</div><div class="labs">${labs.join('')}</div></div>`;
}
function rankDial(site){
  const ranks = site.ranks, N = ranks.length, S=600, cx=300, cy=300, total=252, step=total/N, start=270-total+step/2, parts=[], labs=[], VB={x:-120,y:-30,w:840,h:660,cx,cy};
  parts.push(`<circle cx="${cx}" cy="${cy}" r="72" fill="var(--glass)" stroke="var(--line-2)"/>`);
  parts.push(`<circle cx="${cx}" cy="${cy}" r="226" fill="none" stroke="var(--line)" stroke-width="1"/>`);
  site.phases.forEach((ph,i)=>{ const [lo,hi]=ph.ranks.split('–').map(Number); const a0=start+(lo-1)*step+1.5, a1=start+hi*step-1.5; parts.push(`<path d="${arcPath(cx,cy,140,a0,a1)}" fill="none" stroke="${i?'var(--gold)':'var(--green)'}" stroke-opacity=".5" stroke-width="4"/>`); const [tx,ty]=polar(cx,cy,118,(a0+a1)/2); parts.push(`<text x="${f(tx)}" y="${f(ty)+3}" text-anchor="middle" font-size="9" font-weight="600" letter-spacing="1" fill="var(--ink-3)">RANKS ${esc(ph.ranks)}</text>`); });
  ranks.forEach((r,i)=>{
    const a0 = start + i*step + 2, a1 = start + (i+1)*step - 2, mid=(a0+a1)/2, gold = r.level>=5;
    parts.push(`<a href="${r.url}"><title>${esc(r.title)} · rank ${r.level} of ${N}</title><path d="${arcPath(cx,cy,190,a0,a1)}" fill="none" stroke="${gold?'var(--gold)':'var(--green)'}" stroke-opacity="${.45+.55*(i+1)/N}" stroke-width="26"/></a>`);
    const [tx,ty]=polar(cx,cy,190,mid); parts.push(`<text x="${f(tx)}" y="${f(ty)+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${gold?'oklch(0.2 0.03 85)':'oklch(0.98 0.005 95)'}" pointer-events="none">${r.level}</text>`);
    for(let k=0;k<r.groups;k++){ const ta = a0 + (a1-a0)*(k+.5)/r.groups; const [x0,y0]=polar(cx,cy,208,ta),[x1,y1]=polar(cx,cy,214,ta); parts.push(`<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(x1)}" y2="${f(y1)}" stroke="var(--line-2)" stroke-width="1.2"/>`); }
    labs.push(`<a href="${r.url}" ${labAt(mid,246,'lab',`><span>${esc(r.title)}</span><small>${r.leafCount} requirements</small>`,'',VB)}</a>`);
  });
  const [sx,sy]=polar(cx,cy,226,start-step/2+2), [ex,ey]=polar(cx,cy,226,270);
  parts.push(`<text x="${f(sx)}" y="${f(sy)+4}" text-anchor="start" font-size="9" font-weight="600" letter-spacing="1.4" fill="var(--ink-3)">START</text><text x="${f(ex)}" y="${f(ey)-8}" text-anchor="middle" font-size="9" font-weight="600" letter-spacing="1.4" fill="var(--gold-ink)">SUMMIT</text>`);
  const centre = `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="34" font-weight="700" fill="var(--ink)">${N}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="9" font-weight="600" letter-spacing="1.6" fill="var(--ink-3)">RANKS · SCOUT → EAGLE</text>`;
  return `<div class="map" aria-label="Rank dial"><svg viewBox="${VB.x} ${VB.y} ${VB.w} ${VB.h}" role="img" aria-label="Rank dial: ${N} ranks as ring segments climbing from Scout to Eagle at the summit; inner ring shows the two phases">${parts.join('')}${centre}</svg><div class="labs">${labs.join('')}</div></div>`;
}
const badgeCard = (site,b) => `<a class="card panel" href="${b.url}"><img class="emb" src="${b.emblem}" alt="${esc(b.title)} merit badge emblem" loading="lazy"><span class="t">${esc(b.title)}<small>${esc(b.category)} · ${b.reqCount} requirements</small>${b.eagle?`<span class="eagle">${ms('star','fill')}Eagle-required</span>`:''}</span></a>`;
const rankCard = (site,r) => `<a class="rank panel" href="${r.url}">${lvlGlyph(r.level,site.counts.ranks)}<span class="t">${esc(r.title)}<small>Rank ${r.level} of ${site.counts.ranks}</small></span><p>${esc(r.description)}</p><span class="meta"><span class="chip">${r.groups} groups</span><span class="chip">${r.leafCount} requirements</span>${r.hasGuide?`<span class="chip on">${ms('menu_book')}Guide</span>`:''}</span><p><span class="lbl">Includes</span> ${r.samples.map(esc).join(' · ')}</p></a>`;
function home(site, ctx){

      <div class="reads">${reads.map(([k,v])=>`<div class="read"><span class="lbl">${k}</span><b>${v}</b></div>`).join('')}</div>
      <div class="toolbar"><a class="btn pri" href="${site.cta.href}">${esc(site.cta.label)}${ms('arrow_forward')}</a>${mbu?`<a class="btn" href="/merit-badges/eagle-required/">${ms('star')}Eagle-required list</a>`:`<a class="btn" href="/scouts-bsa/field-guides/">${ms('hiking')}Field guides</a>`}</div>

    <section class="sec" aria-labelledby="c-h"><div class="sec__h"><h2 id="c-h">Browse by category</h2><p>${c.categories} fields of interest, the same spokes as the atlas above.</p></div><div class="cats">${site.categories.map(ct=>`<a class="cat" href="${ct.url}">${ms(icon(ct.icon))}<span>${esc(ct.name)}</span><span class="n">${ct.count}</span></a>`).join('')}</div></section>
    <section class="sec" aria-labelledby="s-h"><div class="sec__h"><h2 id="s-h">What is on a badge page</h2></div><div class="field"><figure><img src="${site.hero.image}" alt="${esc(site.hero.alt)}" loading="lazy"></figure><div class="steps">${site.steps.map((st,i)=>`<div class="step panel">${ms(icon(st.icon))}<h3>${esc(st.title)}</h3><span class="n">0${i+1}</span><p>${esc(st.text)}</p></div>`).join('')}</div></div></section>
    <section class="sec" aria-labelledby="e-h"><div class="sec__h"><h2 id="e-h">${ms('star','fill')} Eagle-required merit badges</h2><p>${c.eagleBadges} badges across ${c.eagle} categories. The emblems orbiting the atlas hub.</p><a class="more" href="/merit-badges/eagle-required/strategy/">Eagle badge strategy ${ms('arrow_forward')}</a></div><div class="cards">${site.eagle.map(b=>badgeCard(site,b)).join('')}</div></section>
    <section class="sec" aria-labelledby="m-h"><div class="sec__h"><h2 id="m-h">More badges</h2><a class="more" href="/merit-badges/">Browse all ${ms('arrow_forward')}</a></div><div class="cards">${site.more.map(b=>badgeCard(site,b)).join('')}</div></section>`
  : `
    <section class="sec" aria-labelledby="p-h"><div class="sec__h"><h2 id="p-h">Two phases of the trail</h2><p>The inner ring of the dial.</p></div><div class="phases">${site.phases.map((ph,i)=>`<div class="phase panel ${i?'g':''}"><span class="lbl ${i?'gold':'green'}">Ranks ${esc(ph.ranks)}</span><h3>${esc(ph.title)}</h3><p>${esc(ph.text)}</p></div>`).join('')}</div></section>
    <section class="sec" aria-labelledby="r-h"><div class="sec__h"><h2 id="r-h">The seven ranks</h2><a class="more" href="${site.cta.href}">All ranks ${ms('arrow_forward')}</a></div><div class="ranks">${site.ranks.map(r=>rankCard(site,r)).join('')}</div></section>
    <section class="sec" aria-labelledby="g-h"><div class="sec__h"><h2 id="g-h">Field guides</h2><p>Skills that span several ranks, in one place.</p></div><div class="field"><figure><img src="${site.hero.image}" alt="${esc(site.hero.alt)}" loading="lazy"></figure><div class="cats" style="align-self:start">${site.fieldGuides.map(g=>`<a class="cat" href="${g.url}">${ms('hiking')}<span>${esc(g.title)}</span><span class="n">${ms('arrow_forward')}</span></a>`).join('')}</div></div></section>`;
  return header(site,ctx) + `<main id="main" class="wrap">${hero}${body}</main>` + footer(site);
}

/* ================= mount: behaviour ================= */
function mount(ctx, app){
  app.querySelectorAll('[data-toggle-theme]').forEach(b=>b.addEventListener('click', ()=> window.PROTO.go({ theme: ctx.dark ? 'light' : 'dark' })));
  /* command palette */
  const pal = app.querySelector('#palette'), q = pal.querySelector('#pal-q'), list = pal.querySelector('#pal-list'), empty = pal.querySelector('.pal__empty');
  const items = [...list.querySelectorAll('.pal__it')];
  let cur = 0;
  function groups(){ let last=null; list.querySelectorAll('.pal__grp').forEach(g=>g.remove()); items.forEach(it=>{ if(it.hidden) return; if(it.dataset.group!==last){ const g=document.createElement('li'); g.className='pal__grp'; g.textContent=it.dataset.group; g.setAttribute('role','presentation'); it.before(g); last=it.dataset.group; } }); }
  function select(n){ const vis = items.filter(i=>!i.hidden); items.forEach(i=>i.setAttribute('aria-selected','false')); if(!vis.length) return; cur=(n+vis.length)%vis.length; vis[cur].setAttribute('aria-selected','true'); vis[cur].scrollIntoView({block:'nearest'}); }
  function filter(){ const t=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean); items.forEach(i=>{ i.hidden = !t.every(w=>i.dataset.q.includes(w)); }); const any = items.some(i=>!i.hidden); empty.hidden = any; groups(); select(0); }
  const open = ()=>{ if(!pal.open){ pal.showModal(); q.value=''; filter(); q.focus(); } };
  app.querySelectorAll('[data-palette-open]').forEach(b=>b.addEventListener('click', open));
  q.addEventListener('input', filter);
  pal.addEventListener('keydown', e=>{
    e.stopPropagation();
    if (e.key==='ArrowDown'){ e.preventDefault(); select(cur+1); }
    else if (e.key==='ArrowUp'){ e.preventDefault(); select(cur-1); }
    else if (e.key==='Enter'){ e.preventDefault(); const vis=items.filter(i=>!i.hidden); const a = vis[cur]?.querySelector('a'); pal.close(); if (a) a.click(); else window.PROTO.go({page:'search'}); }
  });
  pal.addEventListener('click', e=>{ if (e.target===pal) pal.close(); const a=e.target.closest('a'); if(a) pal.close(); });
  if (!window.__atlasKeys){ window.__atlasKeys = true; document.addEventListener('keydown', e=>{
    const inField = e.target.closest('input,textarea,select,[contenteditable]');
    if ((e.key==='k' || e.key==='K') && (e.metaKey||e.ctrlKey)){ e.preventDefault(); document.querySelector('#palette') && document.querySelector('[data-palette-open]').click(); }
    else if (e.key==='/' && !inField){ e.preventDefault(); document.querySelector('[data-palette-open]')?.click(); }
  }); }
  /* split instruments (requirements + search finder): tracklist → pane, no scroll jump */
  app.querySelectorAll('[data-track-go]').forEach(a=>a.addEventListener('click', e=>{
    e.preventDefault(); const sel = a.getAttribute('href'); const pane = app.querySelector(sel); if(!pane) return;
    const panes = pane.closest('[data-panes]'); panes.querySelectorAll('.pane').forEach(p=>p.classList.toggle('is-current', p===pane));
    const track = panes.previousElementSibling?.querySelector('[data-track]') || app.querySelector('[data-track]');
    track?.querySelectorAll('a').forEach(x=>{ if (x.getAttribute('href')===sel) x.setAttribute('aria-current','true'); else x.removeAttribute('aria-current'); });
    if (location.hash && location.hash!=='#'+window.PROTO.state.page) history.replaceState(null,'','#'+window.PROTO.state.page);
    if (a.closest('.pane__f')) pane.scrollIntoView({block:'start',behavior:'smooth'});
  }));
  /* search page: facet chips filter the finder; form re-runs the search page */
  const facets = app.querySelector('[data-facets]');
  facets?.addEventListener('click', e=>{ const b=e.target.closest('[data-facet]'); if(!b) return; facets.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===b)); const k=b.dataset.facet; const rows=[...app.querySelectorAll('.flist li')]; rows.forEach(li=>li.hidden = k!=='all' && li.dataset.facet!==k); const first = rows.find(li=>!li.hidden)?.querySelector('a'); if (first && !rows.some(li=>!li.hidden && li.querySelector('a[aria-current]'))) first.click(); });
  app.querySelector('[data-search-form]')?.addEventListener('submit', e=>{ e.preventDefault(); window.PROTO.go({page:'search'}); });
  /* guide lightbox */
  const lb = app.querySelector('#lightbox');
  app.querySelectorAll('[data-lightbox]').forEach(b=>b.addEventListener('click', ()=>{ lb.querySelector('img').src=b.dataset.lightbox; lb.querySelector('img').alt=b.dataset.alt; lb.querySelector('figcaption').textContent=b.dataset.alt; lb.showModal(); }));
  lb?.addEventListener('click', e=>{ if (e.target===lb) lb.close(); });
}

window.OPTION = {
  key:'G', name:'Atlas', thesis:'A spatial reference instrument: radial maps, a requirement wheel, a ⌘K palette and anchored popovers.',
  render:{ home, award, requirements, guide, search },
  mount
};
})();
</script>
<script src="proto.js"></script>
