baseURL = "https://example.org/"
title = "uni-theme fixture site"

[params.theme]
  tagline = "A fixture site for uni-theme partials."

[module]
[[module.imports]]
path = "github.com/markgoho/uni-theme"

[params.imagekit]
  endpoint = "https://ik.imagekit.io/example"
  widths = [400, 800]

[params.drg.image]
  path = "/fixture-assets/%s/guide/%s"
  max_width = 800

[outputs]
  home = ["html", "rss", "markdown", "robots", "llms", "llmsfull", "agentskills", "ard", "aicatalog"]

[params.agents.representative_queries]
  fixture-lookup = ["What are the Fixture Badge requirements?", "Show requirement 1a of the Fixture Badge"]
